<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Networking Specialty | DiveLearn</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Symora';src:url('symora.otf') format('opentype');font-weight:100 900;font-display:swap}
:root{
  --purple:#5453eb;--purple-mid:#7b7aff;--lav:#b2cafd;--lime:#e0f24a;
  --bg:#09091a;--s1:#12122a;--s2:#1a1a3c;--s3:#25255a;
  --text:#eeeeff;--muted:#8d8dc0;--line:rgba(178,202,253,.10);--line2:rgba(84,83,235,.35);
  --display:'Symora','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --r:20px;--rail:264px;color-scheme:dark
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(900px 500px at 85% -10%,rgba(84,83,235,.22),transparent 60%),
  radial-gradient(600px 400px at -10% 110%,rgba(224,242,74,.06),transparent 60%);z-index:0}
a{color:var(--lav)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:8px}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:rgba(9,9,26,.6);backdrop-filter:blur(20px)}
.rail .logo{height:26px;width:auto;margin:4px 8px 6px;align-self:flex-start}
.kbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.9rem}
.kbtn:hover{border-color:var(--line2);color:var(--text)}
.kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--lav)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.nav .lbl{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.nav a{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;position:relative}
.nav a:hover{background:var(--s1);color:var(--text)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(84,83,235,.28),rgba(84,83,235,.06));color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-4px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--lime)}
.code{font-family:var(--mono);font-size:.7rem;font-weight:700;display:grid;place-items:center;height:26px;border-radius:8px;background:var(--s2);border:1px solid var(--line);color:var(--lav)}
.nav a[aria-current="page"] .code{background:var(--purple);border-color:var(--purple);color:#fff}
.mini{display:block;height:2px;border-radius:2px;background:rgba(178,202,253,.08);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--lime);width:0;transition:width .5s}
.rail .cta{margin-top:auto;background:var(--lime);color:#09091a;border:none;border-radius:14px;padding:12px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.rail .cta:hover{filter:brightness(1.05);transform:translateY(-1px)}

main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px))}
.view{max-width:1080px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* mobile top bar */
.topbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;gap:10px;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top,0px));background:rgba(9,9,26,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .topbar img{height:22px}
  .topbar .kbtn{width:auto;margin-left:auto;padding:8px 12px}
  .pills{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:19;background:rgba(9,9,26,.85);backdrop-filter:blur(16px)}
  .pills a{flex:none;text-decoration:none;font-weight:800;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--s1)}
  .pills a[aria-current="page"]{background:var(--purple);border-color:var(--purple);color:#fff}
}
@media (min-width:901px){.pills{display:none}}

/* ---------- home bento ---------- */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
a.tile{text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
a.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero{grid-column:span 4;grid-row:span 2;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,#16163a,#0e0e24)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:relative;pointer-events:none}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5.2vw,4rem);line-height:.98;margin:10px 0 12px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--lime);display:block}
.hero p{margin:0;color:var(--lav);max-width:46ch}
.stat-tile{grid-column:span 2;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:3.2rem;line-height:1;color:#fff}
.big small{font-family:var(--body);font-size:1rem;color:var(--muted);font-weight:700}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--s3) 0);display:grid;place-items:center;flex:none}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-family:var(--mono);font-size:1.05rem}
.prog-tile{display:flex;align-items:center;gap:18px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.fact{font-family:var(--mono);font-size:.72rem;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--lav)}
.dom{grid-column:span 3;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.dom h3{margin:4px 0 0;font-size:1.15rem;font-weight:900;line-height:1.25}
.dom .w{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--lime);text-align:right}
.dom .w small{font-family:var(--mono);font-size:.65rem;color:var(--muted);display:block;letter-spacing:.1em}
.dom .meta{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-weight:700;margin-top:10px}
.dom .bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--s3);overflow:hidden}
.dom .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--lime));width:0;transition:width .6s}
.trap{grid-column:span 4;background:linear-gradient(135deg,rgba(224,242,74,.10),rgba(224,242,74,.02));border-color:rgba(224,242,74,.25)}
.trap .q{font-weight:900;font-size:1.05rem;margin:8px 0 4px}
.trap .a{color:var(--lav);margin:0 0 14px}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:10px;padding:7px 12px;font-weight:800;font-size:.85rem;color:var(--lav)}
.ghost:hover{border-color:var(--lime);color:var(--lime)}
.play{grid-column:span 2;background:var(--purple);border-color:var(--purple);display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.play .eyebrow{color:var(--lav)}
.play h3{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.05;margin:6px 0 0}
.play span.go{align-self:flex-start;background:var(--lime);color:#09091a;font-weight:900;border-radius:12px;padding:10px 14px}
.extra{grid-column:span 2}
.extra h3{margin:6px 0 4px;font-weight:900;font-size:1.05rem}
.extra p{margin:0;color:var(--muted);font-size:.9rem}
@media (max-width:1100px){.hero{grid-column:span 6}.stat-tile{grid-column:span 3}.trap{grid-column:span 6}.play{grid-column:span 6}.extra{grid-column:span 2}}
@media (max-width:640px){.bento{grid-template-columns:1fr}.bento>*{grid-column:1/-1!important}.hero{min-height:320px;padding-top:170px}}

/* ---------- domain view ---------- */
.dhead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:8px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px}
.dhead h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1;margin:10px 0 0}
.dhead .sub{color:var(--muted);margin-top:10px;font-weight:700}
.dhead .ring{width:84px;height:84px}.dhead .ring b{width:66px;height:66px;font-size:.95rem}
.dgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.index{position:sticky;top:24px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 48px);overflow-y:auto}
.index a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:.84rem;font-weight:700;padding:6px 8px;border-radius:8px;line-height:1.3}
.index a:hover{color:var(--text);background:var(--s1)}
.index a.ok{color:var(--lime)}
.index .n{font-family:var(--mono);font-size:.68rem;opacity:.7;flex:none;width:18px}
.ghead{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin:28px 0 12px}
.ghead:first-child{margin-top:0}
.lead{color:var(--lav);margin-bottom:14px}
.lead p{margin:0 0 8px}
.acc{border:1px solid var(--line);background:var(--s1);border-radius:16px;margin-bottom:10px;scroll-margin-top:90px;transition:border-color .2s}
.acc:hover{border-color:var(--line2)}
.acc.open{border-color:var(--line2);background:linear-gradient(180deg,#15153a,var(--s1) 120px)}
.acc.ok{border-left:3px solid var(--lime)}
.acc-h{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;width:100%;background:none;border:none;text-align:left;padding:16px 18px}
.acc-h .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.acc-h .t{font-weight:900;font-size:1.04rem;line-height:1.3}
.pill{font-family:var(--mono);font-size:.66rem;padding:3px 8px;border-radius:99px;background:rgba(224,242,74,.12);color:var(--lime);white-space:nowrap}
.chev{width:22px;height:22px;transition:transform .25s;color:var(--muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{padding:0 22px 20px 22px}
.acc-b ul{padding-left:20px;margin:6px 0}
.acc-b li{margin:4px 0}.acc-b li::marker{color:var(--purple-mid)}
.acc-b li p{margin:0}
.acc-b strong{color:#fff}
.acc-b h4{color:var(--lav);margin:18px 0 6px;font-size:.95rem}
.acc-b p{margin:8px 0}
.master{display:inline-flex;gap:8px;align-items:center;margin-top:14px;border:1px solid var(--line2);background:transparent;border-radius:12px;padding:9px 14px;font-weight:800;font-size:.85rem;color:var(--lav)}
.master:hover{border-color:var(--lime);color:var(--lime)}
.acc.ok .master{background:var(--lime);color:#09091a;border-color:var(--lime)}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.86rem}
th{background:var(--s2);color:var(--lime);text-align:left;padding:10px 12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
th strong{color:inherit}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td p,th p{margin:0}
.tip{position:relative;border-radius:12px;padding:12px 16px 12px 46px;margin:14px 0;background:rgba(224,242,74,.07);border:1px solid rgba(224,242,74,.22)}
.tip::before{content:"!";position:absolute;left:14px;top:13px;width:20px;height:20px;border-radius:6px;background:var(--lime);color:#09091a;font-weight:900;font-size:.8rem;display:grid;place-items:center}
.tip-k{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.tip p{margin:3px 0 0}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}.index{display:none}.dhead{grid-template-columns:1fr}.dhead .ring{display:none}}
@media (max-width:520px){.acc-h{grid-template-columns:1fr auto;gap:8px}.acc-h .n{display:none}.acc-h .pill{grid-column:1;justify-self:start;order:3}}

/* ---------- reto ---------- */
.arena{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.deck{position:relative;min-height:340px;border-radius:24px;padding:clamp(22px,4vw,40px);background:linear-gradient(150deg,var(--purple),#3a39b8);overflow:hidden;display:flex;flex-direction:column;gap:16px}
.deck::after{content:"";position:absolute;right:-90px;bottom:-90px;width:280px;height:280px;border-radius:50%;border:40px solid rgba(224,242,74,.12)}
.deck .eyebrow{color:var(--lav)}
.deck .q{font-family:var(--display);font-size:clamp(1.4rem,3vw,2rem);line-height:1.15;position:relative}
.deck .a{position:relative;background:rgba(9,9,26,.55);border-radius:14px;padding:14px 16px;color:#fff}
.deck .row{position:relative;margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-l{background:var(--lime);color:#09091a;border:none;border-radius:12px;padding:11px 16px;font-weight:900}
.btn-o{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800}
.opts{position:relative;display:grid;gap:8px}
.opts button{text-align:left;background:rgba(9,9,26,.55);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;font-weight:700;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.opts button:hover:not(:disabled){border-color:var(--lime)}
.opts button .k{font-family:var(--mono);font-size:.72rem;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:1px 6px}
.opts button.ok{background:var(--lime);color:#09091a;border-color:var(--lime)}
.opts button.ko{background:rgba(255,120,140,.25);border-color:#ff8c9c}
.side{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:none;background:none;border-radius:10px;padding:9px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--s3);color:#fff}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:2.2rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.85rem;font-weight:700}
.hint{color:var(--muted);font-size:.8rem}
@media (max-width:900px){.arena{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr 1fr}.side .seg{grid-column:1/-1}}

/* ---------- palette ---------- */
.pal{position:fixed;inset:0;z-index:50;background:rgba(5,5,15,.7);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:12vh 16px 16px}
.pal-box{width:min(640px,100%);background:var(--s1);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.pal input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:18px 20px;font:inherit;font-size:1.05rem;color:var(--text);outline:none}
.pal ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow-y:auto}
.pal li{padding:10px 12px;border-radius:12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.pal li[aria-selected="true"]{background:var(--s3)}
.pal li .x{font-size:.82rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal li b{font-weight:800}
.pal .foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.75rem}
.empty{padding:22px;color:var(--muted);text-align:center}
footer{max-width:1080px;margin:56px auto 0;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer img{height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="arquitecturas.css">
<script src="arquitecturas.js"></script>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Navegación">
    <a href="/" aria-label="DiveLearn, ir al inicio"><img class="logo" src="logo-wordmark-white.png" alt="DiveLearn"></a>
    <button class="kbtn" data-open-pal><span>Buscar en la guía</span><span class="kbd">⌘K</span></button>
    <nav class="nav" id="nav"></nav>
    <button class="cta" data-go="reto">Reto relámpago <span class="mono">→</span></button>
  </aside>

  <div style="min-width:0">
    <header class="topbar"><a href="/" aria-label="DiveLearn, ir al inicio"><img src="logo-wordmark-white.png" alt="DiveLearn"></a><button class="kbtn" data-open-pal aria-label="Buscar">Buscar</button></header>
    <nav class="pills" id="pills" aria-label="Secciones"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="pal" id="pal" hidden role="dialog" aria-modal="true" aria-label="Buscar">
  <div class="pal-box">
    <input id="palIn" placeholder="Busca un tema o una trampa: MACsec, appliance mode, 8500…" autocomplete="off">
    <ul id="palList" role="listbox"></ul>
    <div class="foot"><span>↑↓ moverse</span><span>↵ abrir</span><span>esc cerrar</span></div>
  </div>
</div>

<script>
const DATA=[{"id": "mapa", "label": "Mapa del examen", "short": "Mapa", "w": null, "groups": [{"title": "Visión General Del Examen Ans-C01", "lead": "<p>65 preguntas (50 scored + 15 unscored) · Escala 100-1000 · Mínimo\npara aprobar: 700 · 170 min<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Dominio<\/strong><\/th>\n<th><strong>Peso<\/strong><\/th>\n<th><strong>Temas Principales<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Domain 1: Network Design<\/td>\n<td>30%<\/td>\n<td>Edge services, DNS, LB, routing strategy, multi-account, hybrid<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Domain 2: Network Implementation<\/td>\n<td>26%<\/td>\n<td>VPN, Direct Connect, Transit GW, VPC Endpoints, DNS arch, IaC<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Domain 3: Network Management &amp; Operation<\/td>\n<td>20%<\/td>\n<td>Flow Logs, Traffic Mirroring, CloudWatch, Reachability Analyzer<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Domain 4: Network Security, Compliance &amp; Gov<\/td>\n<td>24%<\/td>\n<td>WAF, Shield, Network Firewall, Firewall Manager, encryption,\nACM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "items": []}]}, {"id": "d1", "label": "Network Design", "short": "D1", "w": 30, "groups": [{"title": "Dominio 1: Network Design (30%)", "lead": "", "items": [{"id": "amazon-vpc-fundamentos", "t": "Amazon VPC – Fundamentos", "h": "\n<p>CIDR = Classless Inter-Domain Routing. Notación que define un rango\nde IPs: dirección base + máscara (ej. 10.0.0.0/16).<\/p>\n<ul>\n<li><p><strong>VPC:<\/strong> Virtual Private Cloud – red virtual aislada\ndentro de AWS. Por defecto, 5 VPCs por región (Soft Limit — se puede\naumentar vía support).<\/p><\/li>\n<li><p><strong>VPC por defecto:<\/strong> AWS crea una VPC default con\nCIDR 172.31.0.0/16 en cada región, con 1 subnet pública por AZ e IGW ya\nconfigurado.<\/p><\/li>\n<li><p><strong>CIDR IPv4:<\/strong> Rango permitido por VPC: /16 (65,536\nIPs) a /28 (16 IPs). IPv6: bloque /56 para VPC, /64 para\nsubnets.<\/p><\/li>\n<li><p><strong>Subnets:<\/strong> Siempre pertenecen a 1 sola AZ (no se\nextienden entre AZs). Tamaño: mínimo /28 (16 IPs, 11 usables), máximo\n/16 (65,536 IPs).<\/p><\/li>\n<li><p><strong>IPs reservadas por subnet:<\/strong> 5 IPs bloqueadas por\nAWS: .0 (dirección de red), .1 (router VPC), .2 (DNS/Route 53 Resolver),\n.3 (uso futuro AWS), .255 (broadcast, bloqueado). Ej. /24 → 251 usables\n(256 - 5). Primeras 4 y la última.<\/p><\/li>\n<li><p><strong>Comunicación interna:<\/strong> Las IPs dentro de la misma\nVPC siempre pueden comunicarse entre sí — la ruta local existe por\ndefecto en todas las route tables y no se puede eliminar.<\/p><\/li>\n<li><p><strong>Subnet pública:<\/strong> Route table tiene ruta 0.0.0.0/0\n→ Internet Gateway (IGW).<\/p><\/li>\n<li><p><strong>Subnet privada:<\/strong> Sin ruta directa a IGW. Salida\nvia NAT Gateway en subnet pública.<\/p><\/li>\n<li><p><strong>Internet Gateway (IGW):<\/strong> Escala horizontalmente,\naltamente disponible, 1 por VPC.<\/p><\/li>\n<li><p><strong>Virtual Private Gateway (VGW):<\/strong> Concentrador\nVPN/DX en lado AWS. 1 por VPC.<\/p><\/li>\n<li><p><strong>DHCP Option Set:<\/strong> Configura domain name, DNS\nservers, NTP. Se asocia a VPC.<\/p><\/li>\n<li><p><strong>Secondary CIDR:<\/strong> Hasta 5 bloques CIDR IPv4 por\nVPC (1 primario + 4 secundarios).<\/p><\/li>\n<li><p><strong>VPC Sharing (RAM):<\/strong> Compartir subnets entre\ncuentas en misma AWS Organization. Los recursos se crean en la cuenta\nparticipante.<\/p><\/li>\n<li><p><strong>Dual-Homed (ENI secundaria):<\/strong> Adjuntar una ENI\nadicional de otra subnet a una instancia la convierte en dual-homed:\nconectada a 2 redes simultáneamente. Útil para separar tráfico de\ngestión del de producción, o para appliances de seguridad.<\/p><\/li>\n<\/ul>\n<h4>Route Tables – Conceptos Clave<\/h4>\n<ul>\n<li><p>Cada VPC tiene una Main Route Table (default). Cada subnet se\nasocia a una RT; si no se asigna explícitamente, usa la main\nRT.<\/p><\/li>\n<li><p>La ruta local (ej. 10.0.0.0/16 local) SIEMPRE existe en todas las\nroute tables y permite la comunicación interna entre recursos de la VPC\n— no se puede eliminar ni modificar.<\/p><\/li>\n<li><p>Las rutas más específicas (prefijo más largo) tienen prioridad:\n/28 gana sobre /24, que gana sobre /16.<\/p><\/li>\n<li><p>Una subnet pública = una RT con ruta 0.0.0.0/0 → IGW. Una subnet\nprivada = una RT con ruta 0.0.0.0/0 → NAT Gateway.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>La ruta local siempre existe y permite la\ncomunicación interna a menos que el enunciado te explique lo contrario.\nNo necesitas configurar nada para que dos instancias en distintas\nsubnets de la misma VPC se comuniquen — solo asegúrate de que los\nSecurity Groups lo permiten.<\/p><\/div>\n<h4>NAT Gateway vs NAT Instance<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Característica<\/strong><\/th>\n<th><strong>NAT Gateway<\/strong><\/th>\n<th><strong>NAT Instance<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Gestión<\/td>\n<td>Managed (AWS)<\/td>\n<td>Self-managed (EC2)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Disponibilidad<\/td>\n<td>Altamente disponible en AZ<\/td>\n<td>Depende de la instancia<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bandwidth<\/td>\n<td>5 Gbps → escala a 100 Gbps<\/td>\n<td>Limitado por tipo de instancia<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Precio<\/td>\n<td>Hourly + data processed<\/td>\n<td>Costo de instancia EC2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Source/Dest Check<\/td>\n<td>No aplica<\/td>\n<td>Debe desactivarse<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bastion host<\/td>\n<td>No soportado<\/td>\n<td>Sí se puede usar<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Security Groups<\/td>\n<td>No aplica (no tiene SG)<\/td>\n<td>Se aplica SG<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>NAT Gateway NO puede actuar como Bastion\nHost ni ser origen/destino de VPN/DX. Crear uno por AZ para HA.<\/p><\/div>\n", "n": 2, "s": "amazon vpc – fundamentos cidr = classless inter-domain routing. notación que define un rango de ips: dirección base + máscara (ej. 10.0.0.0/16). vpc: virtual private cloud – red virtual aislada dentro de aws. por defecto, 5 vpcs por región (soft limit — se puede aumentar vía support). vpc por defecto: aws crea una vpc default con cidr 172.31.0.0/16 en cada región, con 1 subnet pública por az e igw ya configurado. cidr ipv4: rango permitido por vpc: /16 (65,536 ips) a /28 (16 ips). ipv6: bloque /56 para vpc, /64 para subnets. subnets: siempre pertenecen a 1 sola az (no se extienden entre azs). tamaño: mínimo /28 (16 ips, 11 usables), máximo /16 (65,536 ips). ips reservadas por subnet: 5 ips bloqueadas por aws: .0 (dirección de red), .1 (router vpc), .2 (dns/route 53 resolver), .3 (uso futuro aws), .255 (broadcast, bloqueado). ej. /24 → 251 usables (256 - 5). primeras 4 y la última. comunicación interna: las ips dentro de la misma vpc siempre pueden comunicarse entre sí — la ruta local existe por defecto en todas las route tables y no se puede eliminar. subnet pública: route table tiene ruta 0.0.0.0/0 → internet gateway (igw). subnet privada: sin ruta directa a igw. salida via nat gateway en subnet pública. internet gateway (igw): escala horizontalmente, altamente disponible, 1 por vpc. virtual private gateway (vgw): concentrador vpn/dx en lado aws. 1 por vpc. dhcp option set: configura domain name, dns servers, ntp. se asocia a vpc. secondary cidr: hasta 5 bloques cidr ipv4 por vpc (1 primario + 4 secundarios). vpc sharing (ram): compartir subnets entre cuentas en misma aws organization. los recursos se crean en la cuenta participante. dual-homed (eni secundaria): adjuntar una eni adicional de otra subnet a una instancia la convierte en dual-homed: conectada a 2 redes simultáneamente. útil para separar tráfico de gestión del de producción, o para appliances de seguridad. route tables – conceptos clave cada vpc tiene una main route table (default). cada subnet se asocia a una rt; si no se asigna explícitamente, usa la main rt. la ruta local (ej. 10.0.0.0/16 local) siempre existe en todas las route tables y permite la comunicación interna entre recursos de la vpc — no se puede eliminar ni modificar. las rutas más específicas (prefijo más largo) tienen prioridad: /28 gana sobre /24, que gana sobre /16. una subnet pública = una rt con ruta 0.0.0.0/0 → igw. una subnet privada = una rt con ruta 0.0.0.0/0 → nat gateway. 💡 exam tip la ruta local siempre existe y permite la comunicación interna a menos que el enunciado te explique lo contrario. no necesitas configurar nada para que dos instancias en distintas subnets de la misma vpc se comuniquen — solo asegúrate de que los security groups lo permiten. nat gateway vs nat instance característica nat gateway nat instance gestión managed (aws) self-managed (ec2) disponibilidad altamente disponible en az depende de la instancia bandwidth 5 gbps → escala a 100 gbps limitado por tipo de instancia precio hourly + data processed costo de instancia ec2 source/dest check no aplica debe desactivarse bastion host no soportado sí se puede usar security groups no aplica (no tiene sg) se aplica sg 💡 exam tip nat gateway no puede actuar como bastion host ni ser origen/destino de vpn/dx. crear uno por az para ha."}, {"id": "security-groups-vs-network-acls", "t": "Security Groups vs Network ACLs", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Característica<\/strong><\/th>\n<th><strong>Security Group<\/strong><\/th>\n<th><strong>Network ACL<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Nivel<\/td>\n<td>Instancia / ENI<\/td>\n<td>Subnet<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Estado<\/td>\n<td>Stateful: el tráfico de retorno es automático — no necesitas rutas\nni reglas específicas para retornar el tráfico<\/td>\n<td>Stateless: reglas explícitas ida+vuelta (debes permitir el retorno\nmanualmente)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Reglas<\/td>\n<td>Solo ALLOW<\/td>\n<td>ALLOW y DENY<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Evaluación<\/td>\n<td>Todas las reglas evaluadas<\/td>\n<td>En orden numérico (menor = mayor prioridad)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Default entrada<\/td>\n<td>Deniega todo<\/td>\n<td>NACL default: permite todo<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Referencia SG<\/td>\n<td>Sí (mismo VPC o peered)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Aplica a<\/td>\n<td>Solo recursos con el SG<\/td>\n<td>Todo tráfico hacia/desde la subnet<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>NACLs son stateless: necesitas reglas\npara ephemeral ports (1024-65535) en el retorno. SGs son stateful: el\ntráfico de retorno es automático.<\/p><\/div>\n", "n": 1, "s": "security groups vs network acls característica security group network acl nivel instancia / eni subnet estado stateful: el tráfico de retorno es automático — no necesitas rutas ni reglas específicas para retornar el tráfico stateless: reglas explícitas ida+vuelta (debes permitir el retorno manualmente) reglas solo allow allow y deny evaluación todas las reglas evaluadas en orden numérico (menor = mayor prioridad) default entrada deniega todo nacl default: permite todo referencia sg sí (mismo vpc o peered) no aplica a solo recursos con el sg todo tráfico hacia/desde la subnet 💡 exam tip nacls son stateless: necesitas reglas para ephemeral ports (1024-65535) en el retorno. sgs son stateful: el tráfico de retorno es automático."}, {"id": "vpc-peering", "t": "VPC Peering", "h": "\n<ul>\n<li><p><strong>Concepto:<\/strong> Conexión directa privada entre 2 VPCs\n(misma cuenta, entre cuentas, o entre regiones).<\/p><\/li>\n<li><p>NO transitivo: si A↔︎B y B↔︎C, A no puede hablar con C sin peering\nA↔︎C directo.<\/p><\/li>\n<li><p>No puede haber CIDR solapados entre las VPCs peered.<\/p><\/li>\n<li><p>Route tables en AMBAS VPCs deben ser actualizadas para enrutar al\nCIDR remoto via el peering.<\/p><\/li>\n<li><p>Inter-region peering: tráfico viaja por backbone de AWS, cifrado\nen tránsito.<\/p><\/li>\n<li><p>DNS Resolution: habilitar 'allowDnsResolutionFromRemoteVpc' para\nresolver IPs privadas del peering.<\/p><\/li>\n<li><p>Máximo 125 peering connections activos por VPC.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>VPC Peering NO es transitivo. Para\nconectar muchas VPCs, usa Transit Gateway (hub-and-spoke).<\/p><\/div>\n", "n": 1, "s": "vpc peering concepto: conexión directa privada entre 2 vpcs (misma cuenta, entre cuentas, o entre regiones). no transitivo: si a↔︎b y b↔︎c, a no puede hablar con c sin peering a↔︎c directo. no puede haber cidr solapados entre las vpcs peered. route tables en ambas vpcs deben ser actualizadas para enrutar al cidr remoto via el peering. inter-region peering: tráfico viaja por backbone de aws, cifrado en tránsito. dns resolution: habilitar 'allowdnsresolutionfromremotevpc' para resolver ips privadas del peering. máximo 125 peering connections activos por vpc. 💡 exam tip vpc peering no es transitivo. para conectar muchas vpcs, usa transit gateway (hub-and-spoke)."}, {"id": "amazon-cloudfront", "t": "Amazon CloudFront", "h": "\n<ul>\n<li><p><strong>CDN global:<\/strong> 400+ edge locations (PoPs). Reduce\nlatencia entregando contenido desde el edge.<\/p><\/li>\n<li><p><strong>Orígenes:<\/strong> S3, HTTP (ALB, EC2, on-prem),\nMediaStore, MediaPackage.<\/p><\/li>\n<li><p><strong>OAC (Origin Access Control):<\/strong> Restringe acceso a\nS3 solo a CloudFront (reemplaza OAI). Usa SigV4.<\/p><\/li>\n<li><p><strong>Cache behaviors:<\/strong> Rutas por path → diferentes\norígenes, TTL, headers, cookies, query strings.<\/p><\/li>\n<li><p><strong>TTL:<\/strong> Minimum, Default (24h), Maximum. Controlan\ncuánto se guarda en cache.<\/p><\/li>\n<li><p><strong>Invalidation:<\/strong> /path/*, costo por path invalidado\n(primeros 1000/mes gratis).<\/p><\/li>\n<li><p><strong>Geo Restriction:<\/strong> Whitelist o Blacklist por país\n(solo nivel país).<\/p><\/li>\n<li><p><strong>Price Class:<\/strong> All (más edge, más caro) / 200 /\n100 (solo cheapest regions, ej. NA+EU).<\/p><\/li>\n<li><p><strong>Signed URLs/Cookies:<\/strong> Restringir acceso con\nexpiración y políticas. URL=1 archivo; Cookie=múltiples.<\/p><\/li>\n<li><p><strong>Real-time logs:<\/strong> Kinesis Data Streams. Standard\nlogs: S3.<\/p><\/li>\n<li><p><strong>Field-Level Encryption:<\/strong> Encripta campos\nespecíficos hasta el origen (ej. tarjeta de crédito).<\/p><\/li>\n<li><p><strong>WAF integration:<\/strong> Asociar WebACL de WAF a\ndistribución CloudFront para L7 protection.<\/p><\/li>\n<\/ul>\n<h4>CloudFront Functions vs Lambda@Edge<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Característica<\/strong><\/th>\n<th><strong>CloudFront Functions<\/strong><\/th>\n<th><strong>Lambda@Edge<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ubicación ejecución<\/td>\n<td>Edge locations (PoPs)<\/td>\n<td>Regional edge caches<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Triggers<\/td>\n<td>Viewer Request/Response<\/td>\n<td>Viewer + Origin Request/Response<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Runtime<\/td>\n<td>JavaScript (ES5.1)<\/td>\n<td>Node.js / Python<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tiempo máx.<\/td>\n<td>1 ms<\/td>\n<td>5s (viewer) / 30s (origin)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Memoria<\/td>\n<td>2 MB<\/td>\n<td>128MB-10GB<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Precio<\/td>\n<td>Muy bajo (1/6 Lambda@Edge)<\/td>\n<td>Más caro<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acceso a body<\/td>\n<td>No<\/td>\n<td>Sí (origin triggers)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Casos de uso<\/td>\n<td>Redirect, rewrite URL, header<\/td>\n<td>A/B testing, auth, body manipulation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>OAC es la forma recomendada de asegurar\nS3. Para contenido dinámico, usar Cache-Control: no-cache. Price Class\n100 = las regiones más baratas (NA, Europa).<\/p><\/div>\n", "n": 1, "s": "amazon cloudfront cdn global: 400+ edge locations (pops). reduce latencia entregando contenido desde el edge. orígenes: s3, http (alb, ec2, on-prem), mediastore, mediapackage. oac (origin access control): restringe acceso a s3 solo a cloudfront (reemplaza oai). usa sigv4. cache behaviors: rutas por path → diferentes orígenes, ttl, headers, cookies, query strings. ttl: minimum, default (24h), maximum. controlan cuánto se guarda en cache. invalidation: /path/*, costo por path invalidado (primeros 1000/mes gratis). geo restriction: whitelist o blacklist por país (solo nivel país). price class: all (más edge, más caro) / 200 / 100 (solo cheapest regions, ej. na+eu). signed urls/cookies: restringir acceso con expiración y políticas. url=1 archivo; cookie=múltiples. real-time logs: kinesis data streams. standard logs: s3. field-level encryption: encripta campos específicos hasta el origen (ej. tarjeta de crédito). waf integration: asociar webacl de waf a distribución cloudfront para l7 protection. cloudfront functions vs lambda@edge característica cloudfront functions lambda@edge ubicación ejecución edge locations (pops) regional edge caches triggers viewer request/response viewer + origin request/response runtime javascript (es5.1) node.js / python tiempo máx. 1 ms 5s (viewer) / 30s (origin) memoria 2 mb 128mb-10gb precio muy bajo (1/6 lambda@edge) más caro acceso a body no sí (origin triggers) casos de uso redirect, rewrite url, header a/b testing, auth, body manipulation 💡 exam tip oac es la forma recomendada de asegurar s3. para contenido dinámico, usar cache-control: no-cache. price class 100 = las regiones más baratas (na, europa)."}, {"id": "aws-global-accelerator", "t": "AWS Global Accelerator", "h": "\n<ul>\n<li><p><strong>2 IPs Anycast estáticas:<\/strong> Enrutan al edge\nlocation más cercano de AWS.<\/p><\/li>\n<li><p><strong>Protocolo:<\/strong> TCP y UDP (Layer 4). No es L7 como\nCloudFront.<\/p><\/li>\n<li><p><strong>Endpoints:<\/strong> ALB, NLB, EC2, Elastic IPs. En una o\nvarias regiones.<\/p><\/li>\n<li><p><strong>Traffic dial:<\/strong> Controla % de tráfico hacia cada\nendpoint group (para despliegues graduales).<\/p><\/li>\n<li><p><strong>Endpoint weights:<\/strong> Distribuye tráfico entre\nendpoints del mismo grupo.<\/p><\/li>\n<li><p><strong>Health checks + failover:<\/strong> Detecta fallo y\nredirige automáticamente.<\/p><\/li>\n<li><p><strong>Casos de uso:<\/strong> Gaming, IoT, VoIP, aplicaciones\nno-HTTP que requieren IPs estáticas.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>CloudFront vs Global Accelerator: CF es\nL7/HTTP con caching; GA es L4 Anycast con IPs fijas. GA NO hace caching.\nPara IP estática global + TCP/UDP → GA. Para CDN/HTTP → CF.<\/p><\/div>\n", "n": 1, "s": "aws global accelerator 2 ips anycast estáticas: enrutan al edge location más cercano de aws. protocolo: tcp y udp (layer 4). no es l7 como cloudfront. endpoints: alb, nlb, ec2, elastic ips. en una o varias regiones. traffic dial: controla % de tráfico hacia cada endpoint group (para despliegues graduales). endpoint weights: distribuye tráfico entre endpoints del mismo grupo. health checks + failover: detecta fallo y redirige automáticamente. casos de uso: gaming, iot, voip, aplicaciones no-http que requieren ips estáticas. 💡 exam tip cloudfront vs global accelerator: cf es l7/http con caching; ga es l4 anycast con ips fijas. ga no hace caching. para ip estática global + tcp/udp → ga. para cdn/http → cf."}, {"id": "elastic-load-balancing-comparacion", "t": "Elastic Load Balancing – Comparación", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Característica<\/strong><\/th>\n<th><strong>ALB (L7)<\/strong><\/th>\n<th><strong>NLB (L4)<\/strong><\/th>\n<th><strong>GWLB (L3/4)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Protocolo<\/td>\n<td>HTTP, HTTPS, WebSocket<\/td>\n<td>TCP, UDP, TLS<\/td>\n<td>IP (GENEVE 6081)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Performance<\/td>\n<td>Alta<\/td>\n<td>Extreme (millones req/s)<\/td>\n<td>Transparent passthrough<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>IP estática<\/td>\n<td>No<\/td>\n<td>Sí + Elastic IP por AZ<\/td>\n<td>Sí<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routing inteligente<\/td>\n<td>Path, host, headers, métodos<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>PrivateLink<\/td>\n<td>No<\/td>\n<td>Sí (como provider)<\/td>\n<td>Sí<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cross-zone LB<\/td>\n<td>ON por defecto (sin cargo)<\/td>\n<td>OFF por defecto (con cargo)<\/td>\n<td>OFF (con cargo)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sticky sessions<\/td>\n<td>AWSALB cookie o custom<\/td>\n<td>Sí (source IP)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TLS termination<\/td>\n<td>Sí + SNI<\/td>\n<td>Sí (TLS passthrough también)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Targets<\/td>\n<td>Instancia, IP, Lambda<\/td>\n<td>Instancia, IP, ALB<\/td>\n<td>Instancia, IP<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>WAF<\/td>\n<td>Sí<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Caso de uso típico<\/td>\n<td>Web apps, microservices<\/td>\n<td>Alta perf, TCP/UDP, IP fija<\/td>\n<td>Inline sec. appliances<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>NLB soporta PrivateLink como service\nprovider. ALB NO tiene IP estática (usar NLB si necesitas IP fija). GWLB\nusa protocolo GENEVE puerto 6081 para enviar tráfico a appliances de\nseguridad.<\/p><\/div>\n<h4>ALB – Características Clave<\/h4>\n<ul>\n<li><p>Routing rules: path-based (/api/*), host-based (api.ejemplo.com),\nHTTP headers, query strings, source IP.<\/p><\/li>\n<li><p>Redirect: HTTP → HTTPS automático con regla de redirect.<\/p><\/li>\n<li><p>Fixed response: devuelve respuesta HTTP sin enviar al target (ej.\n403 Forbidden).<\/p><\/li>\n<li><p>SNI: múltiples certificados TLS por listener (1 cert por\ndominio).<\/p><\/li>\n<li><p>User Auth: integración con OIDC/Cognito para autenticación antes\nde llegar al backend.<\/p><\/li>\n<li><p>Connection Draining / Deregistration Delay: 300s default\n(0-3600s). Deja terminar conexiones activas.<\/p><\/li>\n<li><p>Access Logs: a S3. Incluye: IP cliente, request, respuesta,\nprocessing time.<\/p><\/li>\n<\/ul>\n<h4>NLB – Características Clave<\/h4>\n<ul>\n<li><p>Preserve Client IP (TRAMPA DEL EXAMEN): si el target está\nregistrado por Instance ID → IP del cliente se preserva POR DEFECTO. Si\nel target está registrado por IP Address (pods EKS, on-prem) → el\nbackend ve la IP del NLB; para ver la IP real del cliente debes activar\nProxy Protocol v2.<\/p><\/li>\n<li><p>Zonal DNS: cada AZ tiene su propio DNS endpoint (para minimize AZ\ncrossing).<\/p><\/li>\n<li><p>TLS passthrough: reenvía TLS sin terminar al target (conexión E2E\ncifrada).<\/p><\/li>\n<\/ul>\n<h4>GWLB – Características Clave<\/h4>\n<ul>\n<li><p>Gateway Load Balancer Endpoint (GWLBE): redirige tráfico VPC\nhacia el GWLB.<\/p><\/li>\n<li><p>Flujo: Traffic → GWLBE → GWLB → Security Appliance → GWLB → GWLBE\n→ destino original.<\/p><\/li>\n<li><p>Transparent: la appliance de seguridad ve el tráfico original sin\nmodificación.<\/p><\/li>\n<\/ul>\n", "n": 1, "s": "elastic load balancing – comparación característica alb (l7) nlb (l4) gwlb (l3/4) protocolo http, https, websocket tcp, udp, tls ip (geneve 6081) performance alta extreme (millones req/s) transparent passthrough ip estática no sí + elastic ip por az sí routing inteligente path, host, headers, métodos no no privatelink no sí (como provider) sí cross-zone lb on por defecto (sin cargo) off por defecto (con cargo) off (con cargo) sticky sessions awsalb cookie o custom sí (source ip) no tls termination sí + sni sí (tls passthrough también) no targets instancia, ip, lambda instancia, ip, alb instancia, ip waf sí no no caso de uso típico web apps, microservices alta perf, tcp/udp, ip fija inline sec. appliances 💡 exam tip nlb soporta privatelink como service provider. alb no tiene ip estática (usar nlb si necesitas ip fija). gwlb usa protocolo geneve puerto 6081 para enviar tráfico a appliances de seguridad. alb – características clave routing rules: path-based (/api/*), host-based (api.ejemplo.com), http headers, query strings, source ip. redirect: http → https automático con regla de redirect. fixed response: devuelve respuesta http sin enviar al target (ej. 403 forbidden). sni: múltiples certificados tls por listener (1 cert por dominio). user auth: integración con oidc/cognito para autenticación antes de llegar al backend. connection draining / deregistration delay: 300s default (0-3600s). deja terminar conexiones activas. access logs: a s3. incluye: ip cliente, request, respuesta, processing time. nlb – características clave preserve client ip (trampa del examen): si el target está registrado por instance id → ip del cliente se preserva por defecto. si el target está registrado por ip address (pods eks, on-prem) → el backend ve la ip del nlb; para ver la ip real del cliente debes activar proxy protocol v2. zonal dns: cada az tiene su propio dns endpoint (para minimize az crossing). tls passthrough: reenvía tls sin terminar al target (conexión e2e cifrada). gwlb – características clave gateway load balancer endpoint (gwlbe): redirige tráfico vpc hacia el gwlb. flujo: traffic → gwlbe → gwlb → security appliance → gwlb → gwlbe → destino original. transparent: la appliance de seguridad ve el tráfico original sin modificación."}]}]}, {"id": "d2", "label": "Network Implementation", "short": "D2", "w": 26, "groups": [{"title": "Dominio 2: Network Implementation (26%)", "lead": "", "items": [{"id": "aws-site-to-site-vpn", "t": "AWS Site-to-Site VPN", "h": "\n<ul>\n<li><p><strong>Componentes:<\/strong> Virtual Private Gateway (VGW) en\nAWS + Customer Gateway (CGW) en on-premises.<\/p><\/li>\n<li><p><strong>Tunnels:<\/strong> 2 túneles IPsec por conexión VPN\n(redundancia). Cada túnel: max 1.25 Gbps.<\/p><\/li>\n<li><p><strong>Routing:<\/strong> Estático o dinámico (BGP). Con BGP se\nnegocian rutas automáticamente.<\/p><\/li>\n<li><p><strong>IKE/IPsec:<\/strong> IKEv1/v2. Algoritmos configurables\n(AES-128/256, SHA-1/2, DH grupos).<\/p><\/li>\n<li><p><strong>DPD:<\/strong> Dead Peer Detection para detectar y\nre-establecer túneles caídos.<\/p><\/li>\n<li><p><strong>VPN over DX:<\/strong> Añadir capa IPsec sobre Direct\nConnect para cifrado de Layer 3.<\/p><\/li>\n<li><p><strong>Accelerated VPN:<\/strong> Usa AWS Global Accelerator para\nmejorar performance (para clientes globales).<\/p><\/li>\n<li><p><strong>ECMP + TGW:<\/strong> Múltiples conexiones VPN a Transit\nGateway + ECMP = mayor bandwidth agregado.<\/p><\/li>\n<li><p><strong>VPN ECMP:<\/strong> Habilitar ECMP en TGW route table.\nCada túnel VPN aporta 1.25 Gbps → 4 tunnels = 5 Gbps+.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>VPN sobre VGW tiene 1 ruta activa a la\nvez (activo/standby). Para ECMP y mayor BW, conectar VPN directamente a\nTransit Gateway.<\/p><\/div>\n", "n": 1, "s": "aws site-to-site vpn componentes: virtual private gateway (vgw) en aws + customer gateway (cgw) en on-premises. tunnels: 2 túneles ipsec por conexión vpn (redundancia). cada túnel: max 1.25 gbps. routing: estático o dinámico (bgp). con bgp se negocian rutas automáticamente. ike/ipsec: ikev1/v2. algoritmos configurables (aes-128/256, sha-1/2, dh grupos). dpd: dead peer detection para detectar y re-establecer túneles caídos. vpn over dx: añadir capa ipsec sobre direct connect para cifrado de layer 3. accelerated vpn: usa aws global accelerator para mejorar performance (para clientes globales). ecmp + tgw: múltiples conexiones vpn a transit gateway + ecmp = mayor bandwidth agregado. vpn ecmp: habilitar ecmp en tgw route table. cada túnel vpn aporta 1.25 gbps → 4 tunnels = 5 gbps+. 💡 exam tip vpn sobre vgw tiene 1 ruta activa a la vez (activo/standby). para ecmp y mayor bw, conectar vpn directamente a transit gateway."}, {"id": "aws-client-vpn", "t": "AWS Client VPN", "h": "\n<ul>\n<li><p><strong>Tipo:<\/strong> OpenVPN managed. Clientes\n(usuarios/dispositivos) → VPC.<\/p><\/li>\n<li><p><strong>Autenticación:<\/strong> Mutual TLS (cert cliente), Active\nDirectory (SAML 2.0), o ambos.<\/p><\/li>\n<li><p><strong>Client CIDR:<\/strong> El rango asignado a clientes NO\npuede solaparse con VPC CIDR.<\/p><\/li>\n<li><p><strong>Split-tunnel:<\/strong> Solo tráfico a AWS va por VPN (más\neficiente). Full-tunnel: todo va por VPN. Con split-tunnel ON, las rutas\nque el cliente VPN instala en el dispositivo son únicamente los CIDRs de\nlas Authorization Rules configuradas — si no hay regla para un CIDR, no\nse enruta por la VPN.<\/p><\/li>\n<li><p><strong>Authorization rules:<\/strong> Controlan qué grupos de AD\nacceden a qué subnets/recursos.<\/p><\/li>\n<li><p><strong>Connection logging:<\/strong> A CloudWatch Logs. Registra\nconexiones de clientes.<\/p><\/li>\n<li><p><strong>NAT:<\/strong> Habilitar si clientes necesitan acceder a\ninternet desde el VPN.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Client VPN NO requiere hardware de ningún\nlado. Para acceso desde dispositivos remotos (empleados) usar Client\nVPN. Para site-to-site (data center) usar Site-to-Site VPN.<\/p><\/div>\n", "n": 1, "s": "aws client vpn tipo: openvpn managed. clientes (usuarios/dispositivos) → vpc. autenticación: mutual tls (cert cliente), active directory (saml 2.0), o ambos. client cidr: el rango asignado a clientes no puede solaparse con vpc cidr. split-tunnel: solo tráfico a aws va por vpn (más eficiente). full-tunnel: todo va por vpn. con split-tunnel on, las rutas que el cliente vpn instala en el dispositivo son únicamente los cidrs de las authorization rules configuradas — si no hay regla para un cidr, no se enruta por la vpn. authorization rules: controlan qué grupos de ad acceden a qué subnets/recursos. connection logging: a cloudwatch logs. registra conexiones de clientes. nat: habilitar si clientes necesitan acceder a internet desde el vpn. 💡 exam tip client vpn no requiere hardware de ningún lado. para acceso desde dispositivos remotos (empleados) usar client vpn. para site-to-site (data center) usar site-to-site vpn."}, {"id": "aws-direct-connect-dx", "t": "AWS Direct Connect (DX)", "h": "\n<ul>\n<li><p><strong>Conexión:<\/strong> Dedicada, privada, desde on-premises a\nAWS (no pasa por internet público).<\/p><\/li>\n<li><p><strong>Velocidades dedicadas:<\/strong> 1, 10, 100 Gbps (en\nDirect Connect locations).<\/p><\/li>\n<li><p><strong>Hosted connections:<\/strong> Vía partner, 50Mbps –\n10Gbps. Más flexibles en velocidad.<\/p><\/li>\n<li><p><strong>Cifrado:<\/strong> DX NO está cifrado por defecto.\nOpciones: MACsec (L2) o IPsec VPN encima (L3).<\/p><\/li>\n<\/ul>\n<h4>Virtual Interfaces (VIFs)<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>VIF Type<\/strong><\/th>\n<th><strong>Accede a<\/strong><\/th>\n<th><strong>BGP ASN<\/strong><\/th>\n<th><strong>Notas<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Private VIF<\/strong><\/td>\n<td>IPs privadas de 1 VPC (o via DX GW: múltiples)<\/td>\n<td>Privado (1-64511)<\/td>\n<td>1 Private VIF por VGW. Via DX GW: múltiples VPCs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Public VIF<\/strong><\/td>\n<td>Todos los servicios públicos AWS (S3, DynamoDB, etc.) en TODAS las\nregiones<\/td>\n<td>Público<\/td>\n<td>Rango de IPs públicas AWS. Para servicios como S3, Glacier<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Transit VIF<\/strong><\/td>\n<td>Transit Gateway (via Direct Connect GW)<\/td>\n<td>Privado<\/td>\n<td>Solo 1 Transit VIF por DX GW. Para TGW multi-region<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Direct Connect Gateway (DX GW)<\/h4>\n<ul>\n<li><p>Permite conectar 1 DX connection a múltiples VPCs en distintas\nregiones.<\/p><\/li>\n<li><p>NO transitivo: VPCs conectadas via el mismo DX GW NO pueden\ncomunicarse entre sí a través de él.<\/p><\/li>\n<li><p>Global: un DX GW puede conectar a VGWs o TGWs en múltiples\nregiones.<\/p><\/li>\n<\/ul>\n<h4>Link Aggregation Group (LAG)<\/h4>\n<ul>\n<li><p>Combina múltiples conexiones DX en una lógica (mayor BW y\nredundancia).<\/p><\/li>\n<li><p>Máximo 4 conexiones por LAG. Todas deben ser la misma velocidad.\nAl mismo DX location.<\/p><\/li>\n<li><p>Minimum links: si baja el número de links activos del mínimo, el\nLAG baja entero.<\/p><\/li>\n<\/ul>\n<h4>Modelos de Resiliencia DX<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Modelo<\/strong><\/th>\n<th><strong>Configuración<\/strong><\/th>\n<th><strong>SLA / Uso<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Maximum Resiliency<\/td>\n<td>Exactamente 4 conexiones: 2 en DX Location A + 2 en DX Location B\nindependiente<\/td>\n<td>Máxima protección. Producción crítica. Sobrevive a 2 fallos\nsimultáneos<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>High Resiliency<\/td>\n<td>2 conexiones en el mismo DX location<\/td>\n<td>Alta disponibilidad. Recomendado para prod<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Dev/Test<\/td>\n<td>1 conexión DX + VPN backup<\/td>\n<td>No-crítico. Si falla DX, VPN como backup<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Single Connection<\/td>\n<td>1 sola conexión DX<\/td>\n<td>No recomendado para producción<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>DX NO está cifrado. Para cumplimiento que\nrequiere cifrado en tránsito: usa MACsec (L2, en dedicated connections)\no VPN IPsec sobre el DX (L3). Public VIF da acceso a TODOS los servicios\nAWS públicos en TODAS las regiones.<\/p><\/div>\n", "n": 1, "s": "aws direct connect (dx) conexión: dedicada, privada, desde on-premises a aws (no pasa por internet público). velocidades dedicadas: 1, 10, 100 gbps (en direct connect locations). hosted connections: vía partner, 50mbps – 10gbps. más flexibles en velocidad. cifrado: dx no está cifrado por defecto. opciones: macsec (l2) o ipsec vpn encima (l3). virtual interfaces (vifs) vif type accede a bgp asn notas private vif ips privadas de 1 vpc (o via dx gw: múltiples) privado (1-64511) 1 private vif por vgw. via dx gw: múltiples vpcs public vif todos los servicios públicos aws (s3, dynamodb, etc.) en todas las regiones público rango de ips públicas aws. para servicios como s3, glacier transit vif transit gateway (via direct connect gw) privado solo 1 transit vif por dx gw. para tgw multi-region direct connect gateway (dx gw) permite conectar 1 dx connection a múltiples vpcs en distintas regiones. no transitivo: vpcs conectadas via el mismo dx gw no pueden comunicarse entre sí a través de él. global: un dx gw puede conectar a vgws o tgws en múltiples regiones. link aggregation group (lag) combina múltiples conexiones dx en una lógica (mayor bw y redundancia). máximo 4 conexiones por lag. todas deben ser la misma velocidad. al mismo dx location. minimum links: si baja el número de links activos del mínimo, el lag baja entero. modelos de resiliencia dx modelo configuración sla / uso maximum resiliency exactamente 4 conexiones: 2 en dx location a + 2 en dx location b independiente máxima protección. producción crítica. sobrevive a 2 fallos simultáneos high resiliency 2 conexiones en el mismo dx location alta disponibilidad. recomendado para prod dev/test 1 conexión dx + vpn backup no-crítico. si falla dx, vpn como backup single connection 1 sola conexión dx no recomendado para producción 💡 exam tip dx no está cifrado. para cumplimiento que requiere cifrado en tránsito: usa macsec (l2, en dedicated connections) o vpn ipsec sobre el dx (l3). public vif da acceso a todos los servicios aws públicos en todas las regiones."}, {"id": "aws-transit-gateway-tgw", "t": "AWS Transit Gateway (TGW)", "h": "\n<ul>\n<li><p><strong>Hub-and-spoke:<\/strong> Un TGW conecta múltiples VPCs,\nVPNs, DX y otros TGWs. Regional.<\/p><\/li>\n<li><p><strong>Attachments:<\/strong> VPC, Site-to-Site VPN, Direct\nConnect GW, TGW Peering, Connect (SD-WAN/GRE).<\/p><\/li>\n<li><p><strong>Route Tables:<\/strong> TGW tiene sus propias RT. Un\nattachment se asocia a una RT; puede propagar a varias.<\/p><\/li>\n<li><p><strong>ECMP:<\/strong> Múltiples VPN connections al TGW con ECMP\npara BW agregado (cada túnel 1.25Gbps).<\/p><\/li>\n<li><p><strong>Multicast:<\/strong> TGW soporta multicast (único en AWS).\nPara aplicaciones multicast entre VPCs.<\/p><\/li>\n<li><p><strong>TGW Peering:<\/strong> Conectar TGWs en distintas\nregiones. Las rutas hacia el peering attachment se agregan como\nESTÁTICAS en las route tables del TGW (no se propagan por BGP). Para\nenrutamiento dinámico global entre regiones: AWS Cloud WAN. ⚠ Verificar\nen la documentación por si hay cambios recientes.<\/p><\/li>\n<li><p><strong>TGW Connect:<\/strong> Attachment GRE/SD-WAN. Hasta 5 Gbps\npor Connect peer, 4 peers por attachment = 20 Gbps.<\/p><\/li>\n<li><p><strong>Bandwidth:<\/strong> Hasta 50 Gbps por VPC attachment\n(burst). En práctica: ancho de banda del ENI de VPC.<\/p><\/li>\n<\/ul>\n<h4>TGW – Patrones de Routing<\/h4>\n<ul>\n<li><p>Full mesh (default): todos pueden hablar con todos → 1 RT\ncompartida, todos propagan.<\/p><\/li>\n<li><p>Segmentación: VPCs de prod no hablan con dev → RT separadas por\nentorno.<\/p><\/li>\n<li><p>Shared Services VPC: VPC con DNS/monitoring accesible por todos →\nrutas específicas.<\/p><\/li>\n<li><p>Blackhole route: ruta en TGW RT con estado 'blackhole' para\nbloquear tráfico.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>TGW NO es transitivo por defecto. Debes\nconfigurar route tables explícitamente. Para aislar entornos (prod vs\ndev), usar RT separadas en el TGW.<\/p><\/div>\n<h4>AWS Cloud WAN<\/h4>\n<ul>\n<li><p>Servicio managed para construir WAN global usando una Core\nNetwork con Network Segments.<\/p><\/li>\n<li><p>Abstrae TGWs y DX Gateways en una vista unificada\nglobal.<\/p><\/li>\n<li><p>Segmentos: separan tráfico (prod, dev, shared services) en el\nplano de control centralizado.<\/p><\/li>\n<li><p>Usa Network Manager para visualización y políticas\ncentralizadas.<\/p><\/li>\n<\/ul>\n", "n": 1, "s": "aws transit gateway (tgw) hub-and-spoke: un tgw conecta múltiples vpcs, vpns, dx y otros tgws. regional. attachments: vpc, site-to-site vpn, direct connect gw, tgw peering, connect (sd-wan/gre). route tables: tgw tiene sus propias rt. un attachment se asocia a una rt; puede propagar a varias. ecmp: múltiples vpn connections al tgw con ecmp para bw agregado (cada túnel 1.25gbps). multicast: tgw soporta multicast (único en aws). para aplicaciones multicast entre vpcs. tgw peering: conectar tgws en distintas regiones. las rutas hacia el peering attachment se agregan como estáticas en las route tables del tgw (no se propagan por bgp). para enrutamiento dinámico global entre regiones: aws cloud wan. ⚠ verificar en la documentación por si hay cambios recientes. tgw connect: attachment gre/sd-wan. hasta 5 gbps por connect peer, 4 peers por attachment = 20 gbps. bandwidth: hasta 50 gbps por vpc attachment (burst). en práctica: ancho de banda del eni de vpc. tgw – patrones de routing full mesh (default): todos pueden hablar con todos → 1 rt compartida, todos propagan. segmentación: vpcs de prod no hablan con dev → rt separadas por entorno. shared services vpc: vpc con dns/monitoring accesible por todos → rutas específicas. blackhole route: ruta en tgw rt con estado 'blackhole' para bloquear tráfico. 💡 exam tip tgw no es transitivo por defecto. debes configurar route tables explícitamente. para aislar entornos (prod vs dev), usar rt separadas en el tgw. aws cloud wan servicio managed para construir wan global usando una core network con network segments. abstrae tgws y dx gateways en una vista unificada global. segmentos: separan tráfico (prod, dev, shared services) en el plano de control centralizado. usa network manager para visualización y políticas centralizadas."}, {"id": "vpc-endpoints", "t": "VPC Endpoints", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Característica<\/strong><\/th>\n<th><strong>Gateway Endpoint<\/strong><\/th>\n<th><strong>Interface Endpoint (PrivateLink)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Servicios<\/td>\n<td>Solo S3 y DynamoDB<\/td>\n<td>La mayoría de servicios AWS + custom<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cómo funciona<\/td>\n<td>Ruta en route table<\/td>\n<td>ENI con IP privada en la subnet<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Costo<\/td>\n<td>Gratis<\/td>\n<td>Hourly + data processing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Security Group<\/td>\n<td>No (usa endpoint policy)<\/td>\n<td>Sí (se asigna SG al ENI)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DNS<\/td>\n<td>No requiere cambio de DNS<\/td>\n<td>Private DNS override (por defecto ON)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Scope<\/td>\n<td>Regional<\/td>\n<td>Zonal (1 ENI por AZ elegida)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cross-VPC<\/td>\n<td>No<\/td>\n<td>Sí via PrivateLink<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acceso on-prem<\/td>\n<td>Requiere VPN/DX + S3 endpoint policy<\/td>\n<td>Sí via VPN/DX al Interface Endpoint<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Gateway Endpoints son GRATIS para S3 y\nDynamoDB. Interface Endpoints (PrivateLink) tienen costo. Desde\non-premises, solo los Interface Endpoints son accesibles via VPN/DX.\nPara S3 desde on-prem: usa Interface Endpoint para S3 (no Gateway).<\/p><\/div>\n<h4>AWS PrivateLink<\/h4>\n<ul>\n<li><p>Exposer un servicio propio a otras cuentas/VPCs sin VPC Peering\nni IGW.<\/p><\/li>\n<li><p>Arquitectura: NLB en Service VPC → PrivateLink → Interface\nEndpoint en Consumer VPC.<\/p><\/li>\n<li><p>No requiere actualizar route tables, no hay solapamiento de CIDRs\ncomo problema.<\/p><\/li>\n<li><p>El consumidor crea un Interface Endpoint apuntando al Service\nName del proveedor.<\/p><\/li>\n<\/ul>\n", "n": 1, "s": "vpc endpoints característica gateway endpoint interface endpoint (privatelink) servicios solo s3 y dynamodb la mayoría de servicios aws + custom cómo funciona ruta en route table eni con ip privada en la subnet costo gratis hourly + data processing security group no (usa endpoint policy) sí (se asigna sg al eni) dns no requiere cambio de dns private dns override (por defecto on) scope regional zonal (1 eni por az elegida) cross-vpc no sí via privatelink acceso on-prem requiere vpn/dx + s3 endpoint policy sí via vpn/dx al interface endpoint 💡 exam tip gateway endpoints son gratis para s3 y dynamodb. interface endpoints (privatelink) tienen costo. desde on-premises, solo los interface endpoints son accesibles via vpn/dx. para s3 desde on-prem: usa interface endpoint para s3 (no gateway). aws privatelink exposer un servicio propio a otras cuentas/vpcs sin vpc peering ni igw. arquitectura: nlb en service vpc → privatelink → interface endpoint en consumer vpc. no requiere actualizar route tables, no hay solapamiento de cidrs como problema. el consumidor crea un interface endpoint apuntando al service name del proveedor."}, {"id": "route-53-resolver-dns-hibrido", "t": "Route 53 Resolver – DNS Híbrido", "h": "\n<ul>\n<li><p><strong>AmazonProvidedDNS:<\/strong> Resuelve en VPC CIDR + 2 (ej.\n10.0.0.2). Alias: 169.254.169.253.<\/p><\/li>\n<li><p><strong>Inbound Endpoint:<\/strong> On-premises → AWS. DNS queries\ndesde on-prem se reenvían al endpoint en AWS.<\/p><\/li>\n<li><p><strong>Outbound Endpoint:<\/strong> AWS → On-premises. Forwarding\nrules envían queries a DNS on-prem.<\/p><\/li>\n<li><p><strong>Forwarding Rules:<\/strong> Especifican qué dominios se\nreenvían a qué DNS servers (on-prem).<\/p><\/li>\n<li><p><strong>System Rules:<\/strong> Reglas automáticas para zonas\nprivadas asociadas a la VPC.<\/p><\/li>\n<li><p><strong>Sharing Rules via RAM:<\/strong> Compartir resolver rules\nentre cuentas de la misma Organization.<\/p><\/li>\n<li><p><strong>Resolver DNS Firewall:<\/strong> Bloquear dominios\nmaliciosos. Listas gestionadas por AWS o custom.<\/p><\/li>\n<li><p><strong>Query Logging:<\/strong> Registra todas las DNS queries a\nCloudWatch Logs / S3 / Firehose.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Inbound Endpoint = on-prem puede resolver\nnombres en AWS. Outbound Endpoint = VPCs en AWS pueden resolver nombres\nen on-prem. Se necesitan ENIs en subnets privadas para los\nendpoints.<\/p><\/div>\n", "n": 1, "s": "route 53 resolver – dns híbrido amazonprovideddns: resuelve en vpc cidr + 2 (ej. 10.0.0.2). alias: 169.254.169.253. inbound endpoint: on-premises → aws. dns queries desde on-prem se reenvían al endpoint en aws. outbound endpoint: aws → on-premises. forwarding rules envían queries a dns on-prem. forwarding rules: especifican qué dominios se reenvían a qué dns servers (on-prem). system rules: reglas automáticas para zonas privadas asociadas a la vpc. sharing rules via ram: compartir resolver rules entre cuentas de la misma organization. resolver dns firewall: bloquear dominios maliciosos. listas gestionadas por aws o custom. query logging: registra todas las dns queries a cloudwatch logs / s3 / firehose. 💡 exam tip inbound endpoint = on-prem puede resolver nombres en aws. outbound endpoint = vpcs en aws pueden resolver nombres en on-prem. se necesitan enis en subnets privadas para los endpoints."}, {"id": "amazon-route-53-dns-completo", "t": "Amazon Route 53 – DNS Completo", "h": "\n<ul>\n<li><p><strong>Public Hosted Zone:<\/strong> Resuelve desde internet. Se\ncrea automáticamente con NS y SOA records.<\/p><\/li>\n<li><p><strong>Private Hosted Zone:<\/strong> Resuelve solo dentro de\nVPCs asociadas. Puede asociarse a múltiples VPCs (misma o distintas\ncuentas).<\/p><\/li>\n<li><p><strong>TTL:<\/strong> Tiempo en que los resolvers cachean el\nrecord. Reducir antes de migrar DNS.<\/p><\/li>\n<li><p><strong>DNSSEC:<\/strong> Firma los records. Valida autenticidad\nde respuestas. Route 53 es KSK+ZSK.<\/p><\/li>\n<\/ul>\n<h4>Record Types<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Record<\/strong><\/th>\n<th><strong>Descripción<\/strong><\/th>\n<th><strong>¿Alias posible?<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A<\/td>\n<td>IPv4 address<\/td>\n<td>Sí<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>AAAA<\/td>\n<td>IPv6 address<\/td>\n<td>Sí<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CNAME<\/td>\n<td>Canonical name (alias a otro hostname). NO en apex del dominio<\/td>\n<td>No (no aplica)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Alias<\/td>\n<td>Extension Route 53: apunta a AWS resources (ALB, CF, S3, etc.)\nincluso en apex<\/td>\n<td>—<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MX<\/td>\n<td>Mail server, con prioridad<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TXT<\/td>\n<td>Texto arbitrario (SPF, DKIM, verificación dominio)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>NS<\/td>\n<td>Name servers de la hosted zone<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CAA<\/td>\n<td>Qué CA puede emitir certs para el dominio<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>PTR<\/td>\n<td>Reverse DNS (IP → hostname)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>SRV<\/td>\n<td>Servicio/puerto/prioridad (ej. SIP, XMPP)<\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Alias records son GRATUITOS cuando\napuntan a recursos AWS (ALB, CloudFront, S3, API GW, Beanstalk, Global\nAccelerator). CNAME NO puede usarse en el apex del dominio (root). Usa\nAlias en su lugar.<\/p><\/div>\n<h4>Routing Policies<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Policy<\/strong><\/th>\n<th><strong>Descripción<\/strong><\/th>\n<th><strong>Caso de Uso<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Simple<\/td>\n<td>Un recurso. Sin health check por defecto<\/td>\n<td>Único recurso sin HA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Weighted<\/td>\n<td>Distribuir % de tráfico entre recursos<\/td>\n<td>A/B testing, migración gradual<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Latency<\/td>\n<td>Redirige al AWS region con menor latencia al cliente<\/td>\n<td>Multi-region para menor latencia<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Failover<\/td>\n<td>Primary activo, secondary pasivo. Health check requerido<\/td>\n<td>Active-passive HA<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Geolocation<\/td>\n<td>Por país o continente del cliente<\/td>\n<td>Contenido localizado, cumplimiento geo<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Geoproximity<\/td>\n<td>Por proximidad geográfica con bias (+/-)<\/td>\n<td>Ajuste fino de distribución geográfica<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Multi-Value<\/td>\n<td>Hasta 8 IPs, con health checks individuales<\/td>\n<td>Simple LB con health checks<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IP-based<\/td>\n<td>Por CIDR del cliente<\/td>\n<td>Usuarios con IPs conocidas (ISPs)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Calculated<\/td>\n<td>Combina resultados de múltiples health checks<\/td>\n<td>HA compleja<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Latency routing ≠ Geolocation. Latency\nusa mediciones reales de latencia a regiones AWS. Geolocation usa la\nubicación del cliente. Multi-Value Answer NO es un load balancer real,\npero puede devolver hasta 8 IPs saludables.<\/p><\/div>\n", "n": 2, "s": "amazon route 53 – dns completo public hosted zone: resuelve desde internet. se crea automáticamente con ns y soa records. private hosted zone: resuelve solo dentro de vpcs asociadas. puede asociarse a múltiples vpcs (misma o distintas cuentas). ttl: tiempo en que los resolvers cachean el record. reducir antes de migrar dns. dnssec: firma los records. valida autenticidad de respuestas. route 53 es ksk+zsk. record types record descripción ¿alias posible? a ipv4 address sí aaaa ipv6 address sí cname canonical name (alias a otro hostname). no en apex del dominio no (no aplica) alias extension route 53: apunta a aws resources (alb, cf, s3, etc.) incluso en apex — mx mail server, con prioridad no txt texto arbitrario (spf, dkim, verificación dominio) no ns name servers de la hosted zone no caa qué ca puede emitir certs para el dominio no ptr reverse dns (ip → hostname) no srv servicio/puerto/prioridad (ej. sip, xmpp) no 💡 exam tip alias records son gratuitos cuando apuntan a recursos aws (alb, cloudfront, s3, api gw, beanstalk, global accelerator). cname no puede usarse en el apex del dominio (root). usa alias en su lugar. routing policies policy descripción caso de uso simple un recurso. sin health check por defecto único recurso sin ha weighted distribuir % de tráfico entre recursos a/b testing, migración gradual latency redirige al aws region con menor latencia al cliente multi-region para menor latencia failover primary activo, secondary pasivo. health check requerido active-passive ha geolocation por país o continente del cliente contenido localizado, cumplimiento geo geoproximity por proximidad geográfica con bias (+/-) ajuste fino de distribución geográfica multi-value hasta 8 ips, con health checks individuales simple lb con health checks ip-based por cidr del cliente usuarios con ips conocidas (isps) calculated combina resultados de múltiples health checks ha compleja 💡 exam tip latency routing ≠ geolocation. latency usa mediciones reales de latencia a regiones aws. geolocation usa la ubicación del cliente. multi-value answer no es un load balancer real, pero puede devolver hasta 8 ips saludables."}]}]}, {"id": "d3", "label": "Management & Operation", "short": "D3", "w": 20, "groups": [{"title": "Dominio 3: Network Management & Operation (20%)", "lead": "", "items": [{"id": "vpc-flow-logs", "t": "VPC Flow Logs", "h": "\n<ul>\n<li><p><strong>Nivel:<\/strong> VPC, Subnet, o ENI individual. Captura\nmetadatos IP (no contenido).<\/p><\/li>\n<li><p><strong>Destinos:<\/strong> CloudWatch Logs, Amazon S3, Amazon\nKinesis Data Firehose.<\/p><\/li>\n<li><p><strong>Formato default:<\/strong> version account-id interface-id\nsrcaddr dstaddr srcport dstport protocol packets bytes start end action\nlog-status<\/p><\/li>\n<li><p><strong>Custom format:<\/strong> Seleccionar campos + nuevos:\nvpc-id, subnet-id, instance-id, az-id, pkt-src, pkt-dst, flow-direction,\ntraffic-path.<\/p><\/li>\n<li><p><strong>Aggregation interval:<\/strong> 1 min (default) o 10\nmin.<\/p><\/li>\n<\/ul>\n<h4>Tráfico NO capturado por Flow Logs<\/h4>\n<ul>\n<li><p>Tráfico al DNS interno de la VPC (169.254.169.253) — excepto\nRoute 53 Resolver.<\/p><\/li>\n<li><p>Tráfico a metadata service (169.254.169.254).<\/p><\/li>\n<li><p>DHCP traffic dentro de la VPC.<\/p><\/li>\n<li><p>Windows license activation traffic (kms.windows.com).<\/p><\/li>\n<li><p>Tráfico hacia/desde la IP reservada del router de la VPC (CIDR\nbase +1, ej. 10.0.0.1).<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>En Flow Logs, 'action=REJECT' indica que\nSG o NACL denegó el tráfico. 'action=ACCEPT' = permitido. Para\ninspección profunda de paquetes (DPI) usar Traffic Mirroring, no Flow\nLogs.<\/p><\/div>\n", "n": 1, "s": "vpc flow logs nivel: vpc, subnet, o eni individual. captura metadatos ip (no contenido). destinos: cloudwatch logs, amazon s3, amazon kinesis data firehose. formato default: version account-id interface-id srcaddr dstaddr srcport dstport protocol packets bytes start end action log-status custom format: seleccionar campos + nuevos: vpc-id, subnet-id, instance-id, az-id, pkt-src, pkt-dst, flow-direction, traffic-path. aggregation interval: 1 min (default) o 10 min. tráfico no capturado por flow logs tráfico al dns interno de la vpc (169.254.169.253) — excepto route 53 resolver. tráfico a metadata service (169.254.169.254). dhcp traffic dentro de la vpc. windows license activation traffic (kms.windows.com). tráfico hacia/desde la ip reservada del router de la vpc (cidr base +1, ej. 10.0.0.1). 💡 exam tip en flow logs, 'action=reject' indica que sg o nacl denegó el tráfico. 'action=accept' = permitido. para inspección profunda de paquetes (dpi) usar traffic mirroring, no flow logs."}, {"id": "vpc-traffic-mirroring", "t": "VPC Traffic Mirroring", "h": "\n<ul>\n<li><p><strong>Función:<\/strong> Copia tráfico de red desde ENIs hacia\nun target para análisis.<\/p><\/li>\n<li><p><strong>Source:<\/strong> Elastic Network Interface (ENI) de\ninstancias EC2.<\/p><\/li>\n<li><p><strong>Target:<\/strong> ENI de una instancia de análisis, o un\nNLB (UDP listener, port 4789 VXLAN).<\/p><\/li>\n<li><p><strong>Filter:<\/strong> Include/exclude por protocolo\n(TCP/UDP/ICMP), puertos, CIDRs.<\/p><\/li>\n<li><p><strong>Caso de uso:<\/strong> IDS/IPS, análisis forense, deep\npacket inspection, threat detection.<\/p><\/li>\n<li><p><strong>Encapsulación:<\/strong> VXLAN (port 4789) para encapsular\nel tráfico mirrored.<\/p><\/li>\n<li><p>Source y target deben estar en la misma VPC o VPCs peered (o via\nTGW).<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Traffic Mirroring copia el tráfico RAW\n(Layer 3/4). Flow Logs solo captura metadatos. Para IDS/IPS en tiempo\nreal: Traffic Mirroring.<\/p><\/div>\n", "n": 1, "s": "vpc traffic mirroring función: copia tráfico de red desde enis hacia un target para análisis. source: elastic network interface (eni) de instancias ec2. target: eni de una instancia de análisis, o un nlb (udp listener, port 4789 vxlan). filter: include/exclude por protocolo (tcp/udp/icmp), puertos, cidrs. caso de uso: ids/ips, análisis forense, deep packet inspection, threat detection. encapsulación: vxlan (port 4789) para encapsular el tráfico mirrored. source y target deben estar en la misma vpc o vpcs peered (o via tgw). 💡 exam tip traffic mirroring copia el tráfico raw (layer 3/4). flow logs solo captura metadatos. para ids/ips en tiempo real: traffic mirroring."}, {"id": "herramientas-de-monitoreo-de-red", "t": "Herramientas de Monitoreo de Red", "h": "\n<h4>Amazon CloudWatch para Networking<\/h4>\n<ul>\n<li><p>Métricas VPC: NetworkIn/Out, NetworkPacketsIn/Out en instancias\nEC2.<\/p><\/li>\n<li><p>NAT Gateway: BytesIn/Out, PacketsIn/Out,\nErrorPortAllocation.<\/p><\/li>\n<li><p>VPN: TunnelState, TunnelDataIn/Out. Alarma en TunnelState = 0\n(túnel caído).<\/p><\/li>\n<li><p>DX: ConnectionState, VirtualInterfaceBpsIngress/Egress.<\/p><\/li>\n<li><p>ALB/NLB: RequestCount, HealthyHostCount, TargetResponseTime,\nHTTP_5XX_Count.<\/p><\/li>\n<\/ul>\n<h4>VPC Reachability Analyzer<\/h4>\n<ul>\n<li><p>Herramienta sin tráfico real: analiza la configuración de red\npara verificar conectividad.<\/p><\/li>\n<li><p>Fuentes/destinos: EC2, ENI, IGW, NLB, VGW, VPC Endpoint.<\/p><\/li>\n<li><p>Muestra el path completo si existe conectividad, o el componente\nbloqueante si no.<\/p><\/li>\n<li><p>Integrable con EventBridge para alertas automáticas cuando cambia\nla config de red.<\/p><\/li>\n<\/ul>\n<h4>Network Access Analyzer<\/h4>\n<ul>\n<li><p>Identifica accesos no deseados a recursos AWS (network access\npaths no intencionales).<\/p><\/li>\n<li><p>Genera 'findings' de rutas que no cumplen el scope definido (ej.\ninternet → DB directa).<\/p><\/li>\n<\/ul>\n<h4>Transit Gateway Network Manager<\/h4>\n<ul>\n<li><p>Vista global del network: VPCs, VPNs, DX, SD-WAN en un mapa\ninteractivo.<\/p><\/li>\n<li><p>Registra la topología completa incluyendo on-premises via Site\nManager.<\/p><\/li>\n<li><p>Monitoreo de eventos: cambios de estado, métricas de TGW\nattachments.<\/p><\/li>\n<\/ul>\n", "n": 0, "s": "herramientas de monitoreo de red amazon cloudwatch para networking métricas vpc: networkin/out, networkpacketsin/out en instancias ec2. nat gateway: bytesin/out, packetsin/out, errorportallocation. vpn: tunnelstate, tunneldatain/out. alarma en tunnelstate = 0 (túnel caído). dx: connectionstate, virtualinterfacebpsingress/egress. alb/nlb: requestcount, healthyhostcount, targetresponsetime, http_5xx_count. vpc reachability analyzer herramienta sin tráfico real: analiza la configuración de red para verificar conectividad. fuentes/destinos: ec2, eni, igw, nlb, vgw, vpc endpoint. muestra el path completo si existe conectividad, o el componente bloqueante si no. integrable con eventbridge para alertas automáticas cuando cambia la config de red. network access analyzer identifica accesos no deseados a recursos aws (network access paths no intencionales). genera 'findings' de rutas que no cumplen el scope definido (ej. internet → db directa). transit gateway network manager vista global del network: vpcs, vpns, dx, sd-wan en un mapa interactivo. registra la topología completa incluyendo on-premises via site manager. monitoreo de eventos: cambios de estado, métricas de tgw attachments."}, {"id": "optimizacion-de-performance-de-red", "t": "Optimización de Performance de Red", "h": "\n<h4>Enhanced Networking<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Tecnología<\/strong><\/th>\n<th><strong>Velocidad Máx.<\/strong><\/th>\n<th><strong>Descripción<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Elastic Network Adapter (ENA)<\/td>\n<td>100 Gbps<\/td>\n<td>Recomendada. SR-IOV. Soportada por la mayoría de instancias\nmodernas.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ENA Express<\/td>\n<td>25 Gbps<\/td>\n<td>ENA + SRD (Scalable Reliable Datagram). Menor latencia, jitter\nreducido.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elastic Fabric Adapter
