ttice."}, {"id": "mtu-por-escenario-tabla-completa", "t": "MTU por Escenario – Tabla Completa", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Escenario de red<\/strong><\/th>\n<th><strong>MTU máximo<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Dentro del VPC (mismo AZ, misma región)<\/td>\n<td>9001 bytes (Jumbo Frames habilitados por defecto)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VPC Peering intra-región<\/td>\n<td>9001 bytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>VPC Peering inter-región<\/td>\n<td>8500 bytes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Direct Connect – Private VIF (rutas propagadas)<\/td>\n<td>9001 bytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Direct Connect – Private VIF (rutas ESTÁTICAS)<\/td>\n<td>1500 bytes (TRAMPA: jumbo solo aplica a rutas propagadas)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Direct Connect – Transit VIF<\/td>\n<td>8500 bytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Direct Connect – Public VIF<\/td>\n<td>1500 bytes (no soporta jumbo frames)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Via VPC Interface Endpoint (PrivateLink)<\/td>\n<td>8500 bytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Transit Gateway (VPC attachments)<\/td>\n<td>8500 bytes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TGW Connect (GRE)<\/td>\n<td>8500 bytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Internet Gateway (tráfico hacia internet)<\/td>\n<td>1500 bytes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NAT Gateway<\/td>\n<td>1500 bytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Site-to-Site VPN (VGW o TGW)<\/td>\n<td>1500 bytes (IPsec encapsulation reduce MTU)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>GWLB (GENEVE encapsulation)<\/td>\n<td>8500 bytes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>La trampa más común: Jumbo Frames en DX\nPrivate VIF solo funcionan para rutas PROPAGADAS desde el VGW. Si la\nruta es ESTÁTICA en la route table, MTU = 1500 aunque la conexión DX\nsoporte 9001. Para verificar MTU: tracepath amazon.com (Linux). Para\nconfigurar: ip link set dev eth0 mtu 9001.<\/p><\/div>\n", "n": 1, "s": "mtu por escenario – tabla completa escenario de red mtu máximo dentro del vpc (mismo az, misma región) 9001 bytes (jumbo frames habilitados por defecto) vpc peering intra-región 9001 bytes vpc peering inter-región 8500 bytes direct connect – private vif (rutas propagadas) 9001 bytes direct connect – private vif (rutas estáticas) 1500 bytes (trampa: jumbo solo aplica a rutas propagadas) direct connect – transit vif 8500 bytes direct connect – public vif 1500 bytes (no soporta jumbo frames) via vpc interface endpoint (privatelink) 8500 bytes transit gateway (vpc attachments) 8500 bytes tgw connect (gre) 8500 bytes internet gateway (tráfico hacia internet) 1500 bytes nat gateway 1500 bytes site-to-site vpn (vgw o tgw) 1500 bytes (ipsec encapsulation reduce mtu) gwlb (geneve encapsulation) 8500 bytes 💡 exam tip la trampa más común: jumbo frames en dx private vif solo funcionan para rutas propagadas desde el vgw. si la ruta es estática en la route table, mtu = 1500 aunque la conexión dx soporte 9001. para verificar mtu: tracepath amazon.com (linux). para configurar: ip link set dev eth0 mtu 9001."}, {"id": "limites-de-ancho-de-banda-referencia-rapida", "t": "Límites de Ancho de Banda – Referencia Rápida", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Escenario<\/strong><\/th>\n<th><strong>Límite BW<\/strong><\/th>\n<th><strong>Nota<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>EC2 single-flow (5-tuple)<\/td>\n<td>5 Gbps<\/td>\n<td>10 Gbps si está en Cluster Placement Group<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EC2 multi-flow (misma región)<\/td>\n<td>Hasta 100 Gbps<\/td>\n<td>Requiere ENA + múltiples flujos simultáneos<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>EC2 → otras regiones/internet/DX<\/td>\n<td>50% del BW de la instancia<\/td>\n<td>O 5 Gbps para instancias &lt; 32 vCPUs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NAT Gateway<\/td>\n<td>5 Gbps → auto-escala a 100 Gbps<\/td>\n<td>55,000 conexiones simultáneas por destino único<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>VGW (S2S VPN agregado)<\/td>\n<td>1.25 Gbps total<\/td>\n<td>No soporta ECMP<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TGW VPN con ECMP (2 conexiones × 2 túneles)<\/td>\n<td>~5 Gbps<\/td>\n<td>Cada túnel = 1.25 Gbps; ECMP distribuye flujos<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>TGW Connect (4 peers × 5 Gbps)<\/td>\n<td>20 Gbps por attachment<\/td>\n<td>BGP obligatorio; no rutas estáticas<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TGW VPC attachment<\/td>\n<td>Hasta 50 Gbps<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DX LAG: 4 × 10G<\/td>\n<td>40 Gbps efectivos<\/td>\n<td>Máx 4 conexiones por LAG (100G: máx 2)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "n": 0, "s": "límites de ancho de banda – referencia rápida escenario límite bw nota ec2 single-flow (5-tuple) 5 gbps 10 gbps si está en cluster placement group ec2 multi-flow (misma región) hasta 100 gbps requiere ena + múltiples flujos simultáneos ec2 → otras regiones/internet/dx 50% del bw de la instancia o 5 gbps para instancias < 32 vcpus nat gateway 5 gbps → auto-escala a 100 gbps 55,000 conexiones simultáneas por destino único vgw (s2s vpn agregado) 1.25 gbps total no soporta ecmp tgw vpn con ecmp (2 conexiones × 2 túneles) ~5 gbps cada túnel = 1.25 gbps; ecmp distribuye flujos tgw connect (4 peers × 5 gbps) 20 gbps por attachment bgp obligatorio; no rutas estáticas tgw vpc attachment hasta 50 gbps dx lag: 4 × 10g 40 gbps efectivos máx 4 conexiones por lag (100g: máx 2)"}, {"id": "elb-detalles-tecnicos-avanzados", "t": "ELB – Detalles Técnicos Avanzados", "h": "\n<h4>Algoritmos de Routing<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Algoritmo<\/strong><\/th>\n<th><strong>LB<\/strong><\/th>\n<th><strong>Descripción<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Least Outstanding Requests<\/td>\n<td>ALB, CLB HTTP/HTTPS<\/td>\n<td>Envía al target con menos requests pendientes. Bueno para variances\nen tiempo de respuesta.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Round Robin<\/td>\n<td>ALB, CLB TCP<\/td>\n<td>Distribuye secuencialmente entre todos los targets.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Flow Hash (5-tuple)<\/td>\n<td>NLB TCP/UDP<\/td>\n<td>Hash de: protocolo + src/dst IP + src/dst port + TCP seq. Misma\nsesión → mismo target de por vida.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Flow Hash (3-tuple)<\/td>\n<td>NLB non-TCP/UDP<\/td>\n<td>Hash de: protocolo + src/dst IP.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>ALB – Restricciones Específicas<\/h4>\n<ul>\n<li><p>Subnet mínima: /27 con al menos 8 IPs libres. Total de IPs que\npuede usar un ALB: máximo 100 IPs.<\/p><\/li>\n<li><p>Weighted Target Groups: distribuir % de tráfico entre grupos (ej.\n90% v1, 10% v2). Útil para blue/green, canary.<\/p><\/li>\n<li><p>Connection Idle Timeout: default 60 segundos (configurable 1-4000\nseg). Si keepalive del cliente expira antes, verás errores 504.<\/p><\/li>\n<li><p>X-Forwarded-For: IP más a la izquierda = cliente original. Si hay\nmúltiples proxies: lista separada por comas.<\/p><\/li>\n<li><p>Autenticación nativa: Cognito, OIDC, SAML, LDAP, Social IDPs —\nautenticación ANTES de llegar al backend.<\/p><\/li>\n<\/ul>\n<h4>NLB – Restricciones Específicas (Trampas)<\/h4>\n<ul>\n<li><p>Latencia: ~100 ms (vs ~400 ms de ALB). Para latencia ultrabaja\nusar NLB.<\/p><\/li>\n<li><p>440,000 conexiones simultáneas por MINUTO por target. Si se\nexcede: port allocation errors. Solución: más targets.<\/p><\/li>\n<li><p>NO se puede quitar una AZ después de habilitarla. NO se pueden\nmodificar ENIs ni cambiar EIPs post-creación.<\/p><\/li>\n<li><p>Idle Timeout NLB: NO configurable. 350 seg para TCP, 120 seg para\nUDP.<\/p><\/li>\n<li><p>Targets en otro VPC (peered): registrar por IP address, NO por\nInstance ID (aunque esté peered).<\/p><\/li>\n<li><p>Passive Health Check: detecta targets unhealthy antes que el\nActive. No se puede deshabilitar.<\/p><\/li>\n<\/ul>\n<h4>Sticky Sessions – Cookies<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Tipo de Cookie<\/strong><\/th>\n<th><strong>LB<\/strong><\/th>\n<th><strong>Nombre Cookie<\/strong><\/th>\n<th><strong>Generada por<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Duration-based<\/td>\n<td>ALB<\/td>\n<td>AWSALB<\/td>\n<td>ALB (expiración configurable)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Duration-based<\/td>\n<td>CLB<\/td>\n<td>AWSELB<\/td>\n<td>CLB<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Application-based (LB genera)<\/td>\n<td>ALB<\/td>\n<td>AWSALBAPP<\/td>\n<td>ALB (copia la cookie del target)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application-based (App genera)<\/td>\n<td>ALB<\/td>\n<td>Personalizado (no usar AWSALB/AWSALBAPP/AWSALBTG)<\/td>\n<td>Target/Backend<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Cross-Zone y TLS/SNI<\/h4>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>LB<\/strong><\/th>\n<th><strong>Cross-Zone Default<\/strong><\/th>\n<th><strong>Costo inter-AZ<\/strong><\/th>\n<th><strong>SNI<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ALB<\/td>\n<td>ON (configurable a nivel TG)<\/td>\n<td>Sin cargo<\/td>\n<td>Sí (múltiples certs por listener)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NLB<\/td>\n<td>OFF<\/td>\n<td>Con cargo si se habilita<\/td>\n<td>Sí (múltiples certs)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>GWLB<\/td>\n<td>OFF<\/td>\n<td>Con cargo si se habilita<\/td>\n<td>No aplica<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CLB<\/td>\n<td>OFF<\/td>\n<td>Sin cargo<\/td>\n<td>NO (solo 1 cert por CLB)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Proxy Protocol v2 en NLB: necesario\ncuando el target se registra por IP (TCP/TLS) para preservar la IP del\ncliente. Si el target es Instance ID o UDP → IP ya se preserva\nautomáticamente. ALB usa X-Forwarded-For (no necesita Proxy Protocol).\nNUNCA habilitar Proxy Protocol si el LB ya está detrás de otro proxy —\ngenera headers duplicados = errores.<\/p><\/div>\n", "n": 1, "s": "elb – detalles técnicos avanzados algoritmos de routing algoritmo lb descripción least outstanding requests alb, clb http/https envía al target con menos requests pendientes. bueno para variances en tiempo de respuesta. round robin alb, clb tcp distribuye secuencialmente entre todos los targets. flow hash (5-tuple) nlb tcp/udp hash de: protocolo + src/dst ip + src/dst port + tcp seq. misma sesión → mismo target de por vida. flow hash (3-tuple) nlb non-tcp/udp hash de: protocolo + src/dst ip. alb – restricciones específicas subnet mínima: /27 con al menos 8 ips libres. total de ips que puede usar un alb: máximo 100 ips. weighted target groups: distribuir % de tráfico entre grupos (ej. 90% v1, 10% v2). útil para blue/green, canary. connection idle timeout: default 60 segundos (configurable 1-4000 seg). si keepalive del cliente expira antes, verás errores 504. x-forwarded-for: ip más a la izquierda = cliente original. si hay múltiples proxies: lista separada por comas. autenticación nativa: cognito, oidc, saml, ldap, social idps — autenticación antes de llegar al backend. nlb – restricciones específicas (trampas) latencia: ~100 ms (vs ~400 ms de alb). para latencia ultrabaja usar nlb. 440,000 conexiones simultáneas por minuto por target. si se excede: port allocation errors. solución: más targets. no se puede quitar una az después de habilitarla. no se pueden modificar enis ni cambiar eips post-creación. idle timeout nlb: no configurable. 350 seg para tcp, 120 seg para udp. targets en otro vpc (peered): registrar por ip address, no por instance id (aunque esté peered). passive health check: detecta targets unhealthy antes que el active. no se puede deshabilitar. sticky sessions – cookies tipo de cookie lb nombre cookie generada por duration-based alb awsalb alb (expiración configurable) duration-based clb awselb clb application-based (lb genera) alb awsalbapp alb (copia la cookie del target) application-based (app genera) alb personalizado (no usar awsalb/awsalbapp/awsalbtg) target/backend cross-zone y tls/sni lb cross-zone default costo inter-az sni alb on (configurable a nivel tg) sin cargo sí (múltiples certs por listener) nlb off con cargo si se habilita sí (múltiples certs) gwlb off con cargo si se habilita no aplica clb off sin cargo no (solo 1 cert por clb) 💡 exam tip proxy protocol v2 en nlb: necesario cuando el target se registra por ip (tcp/tls) para preservar la ip del cliente. si el target es instance id o udp → ip ya se preserva automáticamente. alb usa x-forwarded-for (no necesita proxy protocol). nunca habilitar proxy protocol si el lb ya está detrás de otro proxy — genera headers duplicados = errores."}, {"id": "route-53-health-checks-y-dnssec-detallados", "t": "Route 53 – Health Checks y DNSSEC Detallados", "h": "\n<h4>Health Checks<\/h4>\n<ul>\n<li><p>Solo para recursos PÚBLICOS (HTTP/HTTPS). Para privados:\nCloudWatch Alarm → R53 Health Check on Alarm.<\/p><\/li>\n<li><p>~15 health checkers globales. Umbral healthy: &gt;18% de los\ncheckers deben reportarlo healthy.<\/p><\/li>\n<li><p>Interval: 30 seg (estándar) o 10 seg (costo mayor). Threshold: 3\nchecks consecutivos.<\/p><\/li>\n<li><p>Protocolos: HTTP (80), HTTPS (443), TCP. String matching:\nverifica primeros 5,120 bytes. Status 2xx/3xx = healthy.<\/p><\/li>\n<li><p>Calculated Health Check: hasta 256 child HCs. Operadores: AND,\nOR, NOT.<\/p><\/li>\n<li><p>Para R53 HC hacia recursos privados (EC2, RDS en subnet privada):\ncrear CW Metric + CW Alarm → asociar HC al Alarm.<\/p><\/li>\n<\/ul>\n<h4>DNSSEC<\/h4>\n<ul>\n<li><p>Solo Public Hosted Zones. Autentica origen e integridad de las\nrespuestas DNS.<\/p><\/li>\n<li><p>KSK (Key-Signing Key): gestionada por TI, basada en CMK\nasimétrica en KMS (debe estar en us-east-1).<\/p><\/li>\n<li><p>ZSK (Zone-Signing Key): gestionada por AWS. Sin intervención\nmanual.<\/p><\/li>\n<li><p>Al habilitar: TTL máximo impuesto = 1 semana para SOA/NS.\nPreparar ANTES: bajar TTL a 1h, SOA minimum a 5 min.<\/p><\/li>\n<li><p>Pasos: Preparar (bajar TTLs) → Habilitar DNSSEC + crear KSK →\nEstablecer chain of trust (DS record en zona padre) → CloudWatch Alarms:\nDNSSECInternalFailure y DNSSECKeySigningKeysNeedingAction.<\/p><\/li>\n<\/ul>\n<h4>R53 DNS Firewall (Resolver DNS Firewall)<\/h4>\n<ul>\n<li><p>Filtra consultas DNS salientes del VPC via Route 53 Resolver.\nPreviene DNS exfiltration.<\/p><\/li>\n<li><p>Blacklist (bloquear dominios maliciosos) o Whitelist (solo\ndominios permitidos).<\/p><\/li>\n<li><p>Fail-close: bloquea la query si no hay respuesta del firewall →\nseguridad &gt; disponibilidad.<\/p><\/li>\n<li><p>Fail-open: permite la query si no hay respuesta → disponibilidad\n&gt; seguridad.<\/p><\/li>\n<li><p>Gestionable centralmente via AWS Firewall Manager. Logs a\nCloudWatch y Kinesis Firehose.<\/p><\/li>\n<\/ul>\n", "n": 0, "s": "route 53 – health checks y dnssec detallados health checks solo para recursos públicos (http/https). para privados: cloudwatch alarm → r53 health check on alarm. ~15 health checkers globales. umbral healthy: >18% de los checkers deben reportarlo healthy. interval: 30 seg (estándar) o 10 seg (costo mayor). threshold: 3 checks consecutivos. protocolos: http (80), https (443), tcp. string matching: verifica primeros 5,120 bytes. status 2xx/3xx = healthy. calculated health check: hasta 256 child hcs. operadores: and, or, not. para r53 hc hacia recursos privados (ec2, rds en subnet privada): crear cw metric + cw alarm → asociar hc al alarm. dnssec solo public hosted zones. autentica origen e integridad de las respuestas dns. ksk (key-signing key): gestionada por ti, basada en cmk asimétrica en kms (debe estar en us-east-1). zsk (zone-signing key): gestionada por aws. sin intervención manual. al habilitar: ttl máximo impuesto = 1 semana para soa/ns. preparar antes: bajar ttl a 1h, soa minimum a 5 min. pasos: preparar (bajar ttls) → habilitar dnssec + crear ksk → establecer chain of trust (ds record en zona padre) → cloudwatch alarms: dnssecinternalfailure y dnsseckeysigningkeysneedingaction. r53 dns firewall (resolver dns firewall) filtra consultas dns salientes del vpc via route 53 resolver. previene dns exfiltration. blacklist (bloquear dominios maliciosos) o whitelist (solo dominios permitidos). fail-close: bloquea la query si no hay respuesta del firewall → seguridad > disponibilidad. fail-open: permite la query si no hay respuesta → disponibilidad > seguridad. gestionable centralmente via aws firewall manager. logs a cloudwatch y kinesis firehose."}, {"id": "aws-network-firewall-suricata-y-detalles", "t": "AWS Network Firewall – Suricata y Detalles", "h": "\n<ul>\n<li><p>Motor stateful: Suricata IDS/IPS (Open Information Security\nFoundation).<\/p><\/li>\n<li><p>Comportamiento default STATEFUL: PERMITE todo el tráfico por\ndefecto. Reglas AÑADEN restricciones (opuesto a SGs que deniegan por\ndefecto).<\/p><\/li>\n<li><p>Tipos de Stateful Rules: Standard 5-tuple / Domain List (HTTP\nhost header + HTTPS SNI) / Suricata compatible (sintaxis\ncompleta).<\/p><\/li>\n<li><p>Orden evaluación stateful: pass → drop → alert (por tipo de\nacción primero; luego por número de prioridad dentro de cada\ntipo).<\/p><\/li>\n<li><p>Domain List HTTPS: usa SNI del TLS handshake (no descifra el\ncontenido). HTTP: usa HTTP Host header.<\/p><\/li>\n<li><p>1 política por firewall; una política puede usarse en múltiples\nfirewalls.<\/p><\/li>\n<li><p>Logging: Flow logs + Alert logs + TLS logs → CloudWatch Logs, S3,\nKinesis Firehose.<\/p><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Tipo de regla<\/strong><\/th>\n<th><strong>Stateful/Stateless<\/strong><\/th>\n<th><strong>Descripción<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Stateless 5-tuple<\/td>\n<td>Stateless<\/td>\n<td>Inspección por paquete (src/dst IP, ports, protocolo). Primer match\ngana (por número de prioridad).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Standard stateful<\/td>\n<td>Stateful<\/td>\n<td>5-tuple con contexto de sesión (protocolo, dirección). Detecta: DNS,\nSMB, HTTP, TLS, etc.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Domain List<\/td>\n<td>Stateful<\/td>\n<td>Allow/Deny por domain name. HTTP: host header. HTTPS: SNI. Wildcard:\n.example.com<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Suricata compatible<\/td>\n<td>Stateful<\/td>\n<td>Reglas Suricata completas: drop tcp any any -&gt; any 443 (msg:\n'...'; content: '...'; sid: 1;)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "n": 0, "s": "aws network firewall – suricata y detalles motor stateful: suricata ids/ips (open information security foundation). comportamiento default stateful: permite todo el tráfico por defecto. reglas añaden restricciones (opuesto a sgs que deniegan por defecto). tipos de stateful rules: standard 5-tuple / domain list (http host header + https sni) / suricata compatible (sintaxis completa). orden evaluación stateful: pass → drop → alert (por tipo de acción primero; luego por número de prioridad dentro de cada tipo). domain list https: usa sni del tls handshake (no descifra el contenido). http: usa http host header. 1 política por firewall; una política puede usarse en múltiples firewalls. logging: flow logs + alert logs + tls logs → cloudwatch logs, s3, kinesis firehose. tipo de regla stateful/stateless descripción stateless 5-tuple stateless inspección por paquete (src/dst ip, ports, protocolo). primer match gana (por número de prioridad). standard stateful stateful 5-tuple con contexto de sesión (protocolo, dirección). detecta: dns, smb, http, tls, etc. domain list stateful allow/deny por domain name. http: host header. https: sni. wildcard: .example.com suricata compatible stateful reglas suricata completas: drop tcp any any -> any 443 (msg: '...'; content: '...'; sid: 1;)"}, {"id": "gwlb-restricciones-completas-trampas-del-examen", "t": "GWLB – Restricciones Completas (Trampas del Examen)", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Restricción GWLB<\/strong><\/th>\n<th><strong>Detalle<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Solo interno (no público)<\/td>\n<td>GWLB no tiene endpoint DNS público. Solo internet-facing indirecto\nvia GWLBE en VPC.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Solo IPv4<\/td>\n<td>No soporta dual-stack ni IPv6.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>No SGs en GWLB<\/td>\n<td>No se pueden asociar Security Groups al GWLB. Los SGs de los targets\ndeben usar IPs (no SG IDs) para permitir tráfico.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>MTU máximo<\/td>\n<td>8500 bytes (GENEVE encapsulation).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Listener único<\/td>\n<td>Escucha TODOS los protocolos en TODOS los puertos. No configurable,\nno eliminable.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Protocolo de encapsulación<\/td>\n<td>GENEVE en UDP puerto 6081. Encapsula el paquete IP original\ncompleto.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stickiness de flujos<\/td>\n<td>5-tuple para TCP/UDP; 3-tuple (src/dst IP + proto) para\nnon-TCP/UDP.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Targets soportados<\/td>\n<td>EC2 (ASG) o IPs privadas. No soporta Lambda ni ALB como target.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "n": 0, "s": "gwlb – restricciones completas (trampas del examen) restricción gwlb detalle solo interno (no público) gwlb no tiene endpoint dns público. solo internet-facing indirecto via gwlbe en vpc. solo ipv4 no soporta dual-stack ni ipv6. no sgs en gwlb no se pueden asociar security groups al gwlb. los sgs de los targets deben usar ips (no sg ids) para permitir tráfico. mtu máximo 8500 bytes (geneve encapsulation). listener único escucha todos los protocolos en todos los puertos. no configurable, no eliminable. protocolo de encapsulación geneve en udp puerto 6081. encapsula el paquete ip original completo. stickiness de flujos 5-tuple para tcp/udp; 3-tuple (src/dst ip + proto) para non-tcp/udp. targets soportados ec2 (asg) o ips privadas. no soporta lambda ni alb como target."}, {"id": "eks-formula-de-pods-por-nodo-y-detalles", "t": "EKS – Fórmula de Pods por Nodo y Detalles", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Modo VPC CNI<\/strong><\/th>\n<th><strong>Fórmula Max Pods<\/strong><\/th>\n<th><strong>Ejemplo m5.large (3 ENIs, 10 IPs/ENI)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Estándar IPv4<\/td>\n<td>(ENIs × (IPs/ENI − 1)) + 2<\/td>\n<td>3 × (10−1) + 2 = 29 pods max<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Prefix Delegation IPv4 (/28)<\/td>\n<td>(ENIs × (IPs/ENI − 1) × 16) + 2<\/td>\n<td>3 × 9 × 16 + 2 = 434 (cap recomendado: 110)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Prefix Delegation IPv6 (/80)<\/td>\n<td>Prácticamente ilimitado por ENI<\/td>\n<td>Instancias Nitro solamente<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><p><strong>Prefix Delegation:<\/strong> Solo instancias Nitro. Asigna\nbloques /28 (IPv4) o /80 (IPv6) por ENI. Multiplica masivamente los pods\nposibles por nodo.<\/p><\/li>\n<li><p><strong>Custom Networking:<\/strong> Pods en subnets distintas al\nnodo (para conservar IPs en la subnet del nodo).<\/p><\/li>\n<li><p><strong>Security Groups for Pods:<\/strong> Asignar SGs\nindividuales a pods (no solo al nodo). Requiere ENI trunking\n(Nitro).<\/p><\/li>\n<li><p><strong>IPv6 pods:<\/strong> Solo instancias Nitro. No dual-stack\n(solo IPv6 o solo IPv4). El VPC aún necesita IPv4. No soportado en\nWindows pods.<\/p><\/li>\n<li><p><strong>SNAT IPv4:<\/strong> Pod IP → IP privada primaria del ENI\nprincipal del nodo (cuando sale del VPC).<\/p><\/li>\n<li><p><strong>IPv6 no NAT:<\/strong> Tráfico IPv6 de pods sale directo\nsin NAT.<\/p><\/li>\n<li><p><strong>Endpoint del cluster:<\/strong> Private-only: sin acceso\npúblico; requiere VPN o DX para kubectl. kubectl externo con endpoint\nmixto (Public+Private): usa DNS público.<\/p><\/li>\n<\/ul>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>Fórmula max pods: (número ENIs) ×\n(IPs/ENI − 1) + 2. Con prefix delegation ×16 (IPv4). Tablas de\nreferencia en:\ngithub.com/awslabs/amazon-eks-ami/blob/master/files/eni-max-pods.txt.\nPara aumentar densidad de pods: usar instancias con más ENIs (mayor\ntipo) + prefix delegation.<\/p><\/div>\n", "n": 1, "s": "eks – fórmula de pods por nodo y detalles modo vpc cni fórmula max pods ejemplo m5.large (3 enis, 10 ips/eni) estándar ipv4 (enis × (ips/eni − 1)) + 2 3 × (10−1) + 2 = 29 pods max prefix delegation ipv4 (/28) (enis × (ips/eni − 1) × 16) + 2 3 × 9 × 16 + 2 = 434 (cap recomendado: 110) prefix delegation ipv6 (/80) prácticamente ilimitado por eni instancias nitro solamente prefix delegation: solo instancias nitro. asigna bloques /28 (ipv4) o /80 (ipv6) por eni. multiplica masivamente los pods posibles por nodo. custom networking: pods en subnets distintas al nodo (para conservar ips en la subnet del nodo). security groups for pods: asignar sgs individuales a pods (no solo al nodo). requiere eni trunking (nitro). ipv6 pods: solo instancias nitro. no dual-stack (solo ipv6 o solo ipv4). el vpc aún necesita ipv4. no soportado en windows pods. snat ipv4: pod ip → ip privada primaria del eni principal del nodo (cuando sale del vpc). ipv6 no nat: tráfico ipv6 de pods sale directo sin nat. endpoint del cluster: private-only: sin acceso público; requiere vpn o dx para kubectl. kubectl externo con endpoint mixto (public+private): usa dns público. 💡 exam tip fórmula max pods: (número enis) × (ips/eni − 1) + 2. con prefix delegation ×16 (ipv4). tablas de referencia en: github.com/awslabs/amazon-eks-ami/blob/master/files/eni-max-pods.txt. para aumentar densidad de pods: usar instancias con más enis (mayor tipo) + prefix delegation."}, {"id": "cloudfront-detalles-adicionales", "t": "CloudFront – Detalles Adicionales", "h": "\n<ul>\n<li><p><strong>Edge Locations:<\/strong> 215+ Edge Locations + 13\nRegional Edge Caches. Total: 400+ Points of Presence.<\/p><\/li>\n<li><p><strong>Regional Edge Cache:<\/strong> Cache más grande que PoPs.\nDynamic content NO pasa por Regional Edge Cache (va directo al\norigen).<\/p><\/li>\n<li><p><strong>VPC Origin:<\/strong> Exponer ALB, NLB, EC2 PRIVADOS como\norigen (sin exponerlos a internet). CloudFront se conecta por IP\nprivada.<\/p><\/li>\n<li><p><strong>Custom Headers para ALB:<\/strong> Agregar Custom HTTP\nHeader en CloudFront → origen. Configurar ALB para solo aceptar requests\ncon ese header (secreto mantenido).<\/p><\/li>\n<li><p><strong>Origin Groups:<\/strong> Primary + Secondary. Si primary\ndevuelve error → CloudFront usa secondary automáticamente (failover de\norigen).<\/p><\/li>\n<li><p><strong>Geo Restriction:<\/strong> Solo a nivel de PAÍS (base de\ndatos GeoIP). Aplica a TODA la distribución, no por\npath/behavior.<\/p><\/li>\n<li><p><strong>Certificado TLS en CloudFront:<\/strong> SIEMPRE debe\nestar en us-east-1 (N. Virginia), aunque la distribución sea\nglobal.<\/p><\/li>\n<li><p><strong>SNI en CloudFront:<\/strong> Recomendado (sin costo\nadicional). Dedicated IP: caro (cargo por edge location).<\/p><\/li>\n<li><p><strong>S3 Static Website:<\/strong> NO soporta HTTPS\ndirectamente. Usar CloudFront delante con certificado.<\/p><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>CF Functions vs Lambda@Edge<\/strong><\/th>\n<th><strong>CF Functions<\/strong><\/th>\n<th><strong>Lambda@Edge<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ubicación ejecución<\/td>\n<td>Edge Locations (PoPs)<\/td>\n<td>Regional Edge Caches<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Triggers<\/td>\n<td>Viewer Request/Response SOLO<\/td>\n<td>Viewer + Origin Request/Response<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Runtime<\/td>\n<td>JavaScript (ES5.1)<\/td>\n<td>Node.js / Python<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Max tiempo ejecución<\/td>\n<td>&lt; 1 ms<\/td>\n<td>5 seg (viewer) / 30 seg (origin)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Max memoria<\/td>\n<td>2 MB<\/td>\n<td>128 MB (viewer) / 10 GB (origin)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Package size<\/td>\n<td>10 KB<\/td>\n<td>1 MB (viewer) / 50 MB (origin)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acceso a network<\/td>\n<td>NO<\/td>\n<td>SÍ<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acceso al body<\/td>\n<td>NO<\/td>\n<td>SÍ (origin triggers)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Escala<\/td>\n<td>Millones req/seg<\/td>\n<td>Miles req/seg<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Precio<\/td>\n<td>Free tier, 1/6 de Lambda@Edge<\/td>\n<td>Sin free tier<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Región autoría<\/td>\n<td>N/A (global automático)<\/td>\n<td>SOLO en us-east-1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tip\"><span class=\"tip-k\">💡 Exam tip<\/span><p>CF Functions y Lambda@Edge NO se pueden\ncombinar en el MISMO viewer event (viewer request o viewer response).\nLambda@Edge se authora SIEMPRE en us-east-1, luego AWS lo replica. CF\nFunctions: ideal para alta escala &lt; 1ms (JWT, URL rewrite, header\nmanipulation). Lambda@Edge: cuando necesitas &gt; 1ms, network access, o\nleer el request body.<\/p><\/div>\n", "n": 1, "s": "cloudfront – detalles adicionales edge locations: 215+ edge locations + 13 regional edge caches. total: 400+ points of presence. regional edge cache: cache más grande que pops. dynamic content no pasa por regional edge cache (va directo al origen). vpc origin: exponer alb, nlb, ec2 privados como origen (sin exponerlos a internet). cloudfront se conecta por ip privada. custom headers para alb: agregar custom http header en cloudfront → origen. configurar alb para solo aceptar requests con ese header (secreto mantenido). origin groups: primary + secondary. si primary devuelve error → cloudfront usa secondary automáticamente (failover de origen). geo restriction: solo a nivel de país (base de datos geoip). aplica a toda la distribución, no por path/behavior. certificado tls en cloudfront: siempre debe estar en us-east-1 (n. virginia), aunque la distribución sea global. sni en cloudfront: recomendado (sin costo adicional). dedicated ip: caro (cargo por edge location). s3 static website: no soporta https directamente. usar cloudfront delante con certificado. cf functions vs lambda@edge cf functions lambda@edge ubicación ejecución edge locations (pops) regional edge caches triggers viewer request/response solo viewer + origin request/response runtime javascript (es5.1) node.js / python max tiempo ejecución < 1 ms 5 seg (viewer) / 30 seg (origin) max memoria 2 mb 128 mb (viewer) / 10 gb (origin) package size 10 kb 1 mb (viewer) / 50 mb (origin) acceso a network no sí acceso al body no sí (origin triggers) escala millones req/seg miles req/seg precio free tier, 1/6 de lambda@edge sin free tier región autoría n/a (global automático) solo en us-east-1 💡 exam tip cf functions y lambda@edge no se pueden combinar en el mismo viewer event (viewer request o viewer response). lambda@edge se authora siempre en us-east-1, luego aws lo replica. cf functions: ideal para alta escala < 1ms (jwt, url rewrite, header manipulation). lambda@edge: cuando necesitas > 1ms, network access, o leer el request body."}]}]}, {"id": "rules", "label": "Reglas de 5 segundos", "short": "5s", "w": null, "groups": [{"title": "Quick Reference – Puntos Clave Para El Examen", "lead": "", "items": [{"id": "decisiones-de-conectividad", "t": "Decisiones de Conectividad", "h": "\n<ul>\n<li><p>VPC Peering vs TGW: Peering = 2 VPCs, low cost. TGW = muchas\nVPCs, hub centralizado, mayor costo.<\/p><\/li>\n<li><p>DX vs VPN: VPN = rápido de configurar, internet. DX = latencia\nconsistente, no pasa por internet, mayor costo.<\/p><\/li>\n<li><p>DX + VPN: DX como primario + VPN como backup (dev/test). O VPN\nsobre DX para cifrado L3.<\/p><\/li>\n<li><p>Gateway Endpoint vs Interface Endpoint: GW = gratis\n(S3/DynamoDB). Interface = costo (todos los demás servicios).<\/p><\/li>\n<li><p>ALB vs NLB: ALB para HTTP/L7. NLB para ultra-performance,\nTCP/UDP, IP estática, PrivateLink.<\/p><\/li>\n<li><p>CloudFront vs GA: CloudFront = CDN + caching HTTP. GA = Anycast\nIPs fijas, TCP/UDP, no cache.<\/p><\/li>\n<\/ul>\n", "n": 0, "s": "decisiones de conectividad vpc peering vs tgw: peering = 2 vpcs, low cost. tgw = muchas vpcs, hub centralizado, mayor costo. dx vs vpn: vpn = rápido de configurar, internet. dx = latencia consistente, no pasa por internet, mayor costo. dx + vpn: dx como primario + vpn como backup (dev/test). o vpn sobre dx para cifrado l3. gateway endpoint vs interface endpoint: gw = gratis (s3/dynamodb). interface = costo (todos los demás servicios). alb vs nlb: alb para http/l7. nlb para ultra-performance, tcp/udp, ip estática, privatelink. cloudfront vs ga: cloudfront = cdn + caching http. ga = anycast ips fijas, tcp/udp, no cache."}, {"id": "patrones-de-alta-disponibilidad", "t": "Patrones de Alta Disponibilidad", "h": "\n<ul>\n<li><p>Multi-AZ: siempre desplegar recursos en al menos 2 AZs (subnets,\nNAT GW, endpoints).<\/p><\/li>\n<li><p>DX Maximum Resiliency: 2 DX locations + 2 connections por\nlocation = 4 conexiones.<\/p><\/li>\n<li><p>VPN redundancy: 2 túneles por conexión + múltiples conexiones VPN\nal TGW con ECMP.<\/p><\/li>\n<li><p>R53 Failover: Primary (ALB/EC2) con health check → Secondary\n(static S3 site / otra región).<\/p><\/li>\n<\/ul>\n", "n": 0, "s": "patrones de alta disponibilidad multi-az: siempre desplegar recursos en al menos 2 azs (subnets, nat gw, endpoints). dx maximum resiliency: 2 dx locations + 2 connections por location = 4 conexiones. vpn redundancy: 2 túneles por conexión + múltiples conexiones vpn al tgw con ecmp. r53 failover: primary (alb/ec2) con health check → secondary (static s3 site / otra región)."}, {"id": "seguridad-modelo-de-capas", "t": "Seguridad – Modelo de Capas", "h": "\n<ul>\n<li><p>Edge: CloudFront + WAF + Shield → protege en el borde\nglobal.<\/p><\/li>\n<li><p>Regional: ALB + WAF → protege entradas a la región.<\/p><\/li>\n<li><p>VPC perimeter: Network Firewall (inspection VPC) → inspecta\ntráfico inter-VPC e internet.<\/p><\/li>\n<li><p>Subnet: NACLs → control de acceso a nivel subnet (stateless,\nreglas explícitas).<\/p><\/li>\n<li><p>Instancia: Security Groups → control de acceso a nivel recurso\n(stateful).<\/p><\/li>\n<li><p>Data in transit: TLS (ALB/NLB), IPsec (VPN), MACsec (DX L2), ACM\npara certs.<\/p><\/li>\n<\/ul>\n", "n": 0, "s": "seguridad – modelo de capas edge: cloudfront + waf + shield → protege en el borde global. regional: alb + waf → protege entradas a la región. vpc perimeter: network firewall (inspection vpc) → inspecta tráfico inter-vpc e internet. subnet: nacls → control de acceso a nivel subnet (stateless, reglas explícitas). instancia: security groups → control de acceso a nivel recurso (stateful). data in transit: tls (alb/nlb), ipsec (vpn), macsec (dx l2), acm para certs."}, {"id": "troubleshooting-rapido", "t": "Troubleshooting Rápido", "h": "\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Problema<\/strong><\/th>\n<th><strong>Herramienta / Causa<\/strong><\/th>\n<th><strong>Acción<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>No hay conectividad EC2 → internet<\/td>\n<td>Reachability Analyzer<\/td>\n<td>Verificar: SG, NACL, Route Table (0.0.0.0/0 → IGW), subnet\npública<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EC2 privada no llega a internet<\/td>\n<td>Flow Logs: REJECT en NAT<\/td>\n<td>NAT GW en subnet pública, route en RT privada → NAT GW<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DX tunnel caído<\/td>\n<td>CW Alarm TunnelState=0<\/td>\n<td>Verificar BGP sessions, VLANs, LOA-CFA, DX location status<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DNS no resuelve on-prem desde VPC<\/td>\n<td>R53 Resolver logs<\/td>\n<td>Outbound endpoint + forwarding rule al DNS on-prem<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DNS no resuelve AWS desde on-prem<\/td>\n<td>R53 Resolver logs<\/td>\n<td>Inbound endpoint → apuntar DNS on-prem a endpoint IP<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Latencia alta entre instancias<\/td>\n<td>CW NetworkIn/Out, ENA metr.<\/td>\n<td>Cluster PG, jumbo frames, EFA para HPC, mismo AZ<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tráfico no llega a GWLB appliance<\/td>\n<td>Flow Logs + RT del GWLBE<\/td>\n<td>Verificar routing: IGW → GWLBE → GWLB → appliance<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "n": 0, "s": "troubleshooting rápido problema herramienta / causa acción no hay conectividad ec2 → internet reachability analyzer verificar: sg, nacl, route table (0.0.0.0/0 → igw), subnet pública ec2 privada no llega a internet flow logs: reject en nat nat gw en subnet pública, route en rt privada → nat gw dx tunnel caído cw alarm tunnelstate=0 verificar bgp sessions, vlans, loa-cfa, dx location status dns no resuelve on-prem desde vpc r53 resolver logs outbound endpoint + forwarding rule al dns on-prem dns no resuelve aws desde on-prem r53 resolver logs inbound endpoint → apuntar dns on-prem a endpoint ip latencia alta entre instancias cw networkin/out, ena metr. cluster pg, jumbo frames, efa para hpc, mismo az tráfico no llega a gwlb appliance flow logs + rt del gwlbe verificar routing: igw → gwlbe → gwlb → appliance"}]}, {"title": "Cheat Code – Reglas De 5 Segundos", "lead": "<p>Decisiones de arquitectura instantáneas para las preguntas más\ncomunes del examen ANS-C01:<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Si el examen pide...<\/strong><\/th>\n<th><strong>La respuesta correcta es...<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cifrado a nivel Capa 2 (enlace) en Direct Connect<\/td>\n<td>MACsec (802.1AE) – solo en dedicated connections<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cifrado Capa 3 (IP) sobre Direct Connect<\/td>\n<td>IPsec VPN sobre DX (Public VIF o Transit VIF)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Inspección L7 centralizada para múltiples VPCs (IDS/IPS\nescalable)<\/td>\n<td>AWS Network Firewall en Inspection VPC + TGW centralizado<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Conectar 2 VPCs con CIDRs solapados para compartir 1 servicio<\/td>\n<td>AWS PrivateLink (Interface Endpoint). VPC Peering y TGW fallan con\noverlap.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Verificar reglas SG/NACL sin enviar tráfico real<\/td>\n<td>VPC Reachability Analyzer<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Instancias IPv6 en subnet privada que solo pueden salir a\ninternet<\/td>\n<td>Egress-Only Internet Gateway (EIGW)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pods EKS IPv6-only que necesitan llegar a servicios IPv4<\/td>\n<td>DNS64 + NAT64 en NAT Gateway<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Failover sub-segundo entre DX y VPN de backup<\/td>\n<td>BFD (Bidirectional Forwarding Detection) en router on-prem<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tráfico asimétrico en firewall stateful detrás de TGW<\/td>\n<td>Activar Appliance Mode en TGW VPC Attachment de la Inspection\nVPC<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Priorizar DX sobre VPN para tráfico saliente desde on-prem hacia\nAWS<\/td>\n<td>LOCAL_PREF más alto en el router on-prem para rutas aprendidas por\nDX<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hacer que VPN sea backup: influir tráfico ENTRANTE a AWS<\/td>\n<td>AS_PATH Prepending más largo en las rutas anunciadas por VPN hacia\nAWS<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IP estática global + protocolo TCP/UDP (no HTTP)<\/td>\n<td>AWS Global Accelerator (NO CloudFront)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CDN con caching + HTTPS para contenido web<\/td>\n<td>CloudFront (NO Global Accelerator)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Reemplazar Transit VPC legacy con appliances EC2<\/td>\n<td>AWS Transit Gateway (managed, sin EC2, escalable)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Compartir un servicio con cuentas externas sin peering/IGW<\/td>\n<td>AWS PrivateLink (NLB como provider + Interface Endpoint como\nconsumer)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>On-prem acceder a S3 por IP privada (sin pasar por internet)<\/td>\n<td>Interface Endpoint para S3 (NOT Gateway Endpoint, que no es\naccesible desde on-prem)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Máxima resiliencia DX para producción crítica<\/td>\n<td>4 conexiones: 2 en DX Location A + 2 en DX Location B distintos<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Controlar alcance de rutas anunciadas en Public VIF de DX<\/td>\n<td>BGP Communities (7224:9100 local, 7224:9200 continental, 7224:9300\nglobal)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Conectar oficinas entre sí usando backbone AWS sin pasar por\nRegion<\/td>\n<td>AWS Direct Connect SiteLink (en Private VIF o Transit VIF)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Comunicar microservicios entre VPCs/cuentas con CIDRs solapados<\/td>\n<td>VPC Lattice (service-to-service). PrivateLink si es un servicio\npuntual.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Multiplticast entre VPCs dentro de AWS<\/td>\n<td>Transit Gateway con Multicast habilitado (solo puede activarse al\nCREAR el TGW)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Instancias non-Nitro en solución multicast<\/td>\n<td>Pueden ser RECEIVERS (con Src/Dst check deshabilitado) pero NO\nSENDERS<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>NLB target en VPC pereado → no preserva IP cliente<\/td>\n<td>Registrar target por IP address (no Instance ID) + Proxy Protocol\nv2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ALB/NLB/CF cert → Error: cert not found<\/td>\n<td>CloudFront requiere cert en us-east-1. ALB/NLB: cert en la misma\nregión.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lambda@Edge función no disponible en todas las regiones<\/td>\n<td>Lambda@Edge siempre se authora en us-east-1, AWS la replica\nautomáticamente<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CF Functions + Lambda@Edge en mismo evento viewer<\/td>\n<td>NO es posible combinarlos en viewer request o viewer response del\nmismo behavior<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Route 53 health check para EC2 privado en subnet privada<\/td>\n<td>CloudWatch Metric + CloudWatch Alarm → R53 Health Check monitorea el\nAlarm<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DNSSEC en Private Hosted Zone<\/td>\n<td>No posible. DNSSEC solo para Public Hosted Zones<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DNS Firewall bloquea todo por posible fallo del firewall<\/td>\n<td>Configurar Fail-open (disponibilidad). Fail-close = seguridad &gt;\ndisponibilidad<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Network Firewall stateful: tráfico bloqueado sin configurar\nnada<\/td>\n<td>NO — NF stateful PERMITE todo por defecto. Reglas AÑADEN\nrestricciones (opuesto a SGs)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>GWLB no recibe tráfico de target en otro SG<\/td>\n<td>GWLB no tiene SG propio. Los SGs de los targets deben usar IPs del\nGWLB, no SG IDs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Aumentar pods por nodo EKS más allá de 29 (m5.large estándar)<\/td>\n<td>Habilitar Prefix Delegation (/28 por ENI, ×16 pods). Solo instancias\nNitro<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DX Private VIF con jumbo frames pero MTU llega 1500<\/td>\n<td>Rutas ESTÁTICAS siempre usan 1500. Jumbo frames (9001) solo para\nrutas PROPAGADAS<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>On-premises necesita llegar a S3 via IP privada (no pasa por\ninternet)<\/td>\n<td>Interface Endpoint para S3 (Gateway Endpoint no es accesible desde\non-prem)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BGP Community para que AWS prefiera rutas de un VIF específico<\/td>\n<td>7224:7300 (HIGH) en el VIF preferido, 7224:7100 (LOW) en el backup\n(evaluado antes que AS_PATH)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DX Hosted connection tiene múltiples VIFs<\/td>\n<td>NO — Hosted connection = exactamente 1 VIF. Solo Dedicated admite\nmúltiples VIFs (hasta 50)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Client VPN permite el mismo rango CIDR que el VPC target<\/td>\n<td>Error — Client CIDR NO puede solapar con el VPC CIDR de la subnet\nasociada. Usar /22 a /12.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "items": []}]}];
const CARDS=[{"q": "Amazon VPC – Fundamentos", "a": "La ruta local siempre existe y permite la comunicación interna a menos que el enunciado te explique lo contrario. No necesitas configurar nada para que dos instancias en distintas subnets de la misma VPC se comuniquen — solo asegúrate de que los Security Groups lo permiten.", "k": "tip", "tab": "D1"}, {"q": "Amazon VPC – Fundamentos", "a": "NAT Gateway NO puede actuar como Bastion Host ni ser origen/destino de VPN/DX. Crear uno por AZ para HA.", "k": "tip", "tab": "D1"}, {"q": "Security Groups vs Network ACLs", "a": "NACLs son stateless: necesitas reglas para ephemeral ports (1024-65535) en el retorno. SGs son stateful: el tráfico de retorno es automático.", "k": "tip", "tab": "D1"}, {"q": "VPC Peering", "a": "VPC Peering NO es transitivo. Para conectar muchas VPCs, usa Transit Gateway (hub-and-spoke).", "k": "tip", "tab": "D1"}, {"q": "Amazon CloudFront", "a": "OAC es la forma recomendada de asegurar S3. Para contenido dinámico, usar Cache-Control: no-cache. Price Class 100 = las regiones más baratas (NA, Europa).", "k": "tip", "tab": "D1"}, {"q": "AWS Global Accelerator", "a": "CloudFront vs Global Accelerator: CF es L7/HTTP con caching; GA es L4 Anycast con IPs fijas. GA NO hace caching. Para IP estática global + TCP/UDP → GA. Para CDN/HTTP → CF.", "k": "tip", "tab": "D1"}, {"q": "Elastic Load Balancing – Comparación", "a": "NLB soporta PrivateLink como service provider. ALB NO tiene IP estática (usar NLB si necesitas IP fija). GWLB usa protocolo GENEVE puerto 6081 para enviar tráfico a appliances de seguridad.", "k": "tip", "tab": "D1"}, {"q": "AWS Site-to-Site VPN", "a": "VPN sobre VGW tiene 1 ruta activa a la vez (activo/standby). Para ECMP y mayor BW, conectar VPN directamente a Transit Gateway.", "k": "tip", "tab": "D2"}, {"q": "AWS Client VPN", "a": "Client VPN NO requiere hardware de ningún lado. Para acceso desde dispositivos remotos (empleados) usar Client VPN. Para site-to-site (data center) usar Site-to-Site VPN.", "k": "tip", "tab": "D2"}, {"q": "AWS Direct Connect (DX)", "a": "DX NO está cifrado. Para cumplimiento que requiere cifrado en tránsito: usa MACsec (L2, en dedicated connections) o VPN IPsec sobre el DX (L3). Public VIF da acceso a TODOS los servicios AWS públicos en TODAS las regiones.", "k": "tip", "tab": "D2"}, {"q": "AWS Transit Gateway (TGW)", "a": "TGW NO es transitivo por defecto. Debes configurar route tables explícitamente. Para aislar entornos (prod vs dev), usar RT separadas en el TGW.", "k": "tip", "tab": "D2"}, {"q": "VPC Endpoints", "a": "Gateway Endpoints son GRATIS para S3 y DynamoDB. Interface Endpoints (PrivateLink) tienen costo. Desde on-premises, solo los Interface Endpoints son accesibles via VPN/DX. Para S3 desde on-prem: usa Interface Endpoint para S3 (no Gateway).", "k": "tip", "tab": "D2"}, {"q": "Route 53 Resolver – DNS Híbrido", "a": "Inbound Endpoint = on-prem puede resolver nombres en AWS. Outbound Endpoint = VPCs en AWS pueden resolver nombres en on-prem. Se necesitan ENIs en subnets privadas para los endpoints.", "k": "tip", "tab": "D2"}, {"q": "Amazon Route 53 – DNS Completo", "a": "Alias records son GRATUITOS cuando apuntan a recursos AWS (ALB, CloudFront, S3, API GW, Beanstalk, Global Accelerator). CNAME NO puede usarse en el apex del dominio (root). Usa Alias en su lugar.", "k": "tip", "tab": "D2"}, {"q": "Amazon Route 53 – DNS Completo", "a": "Latency routing ≠ Geolocation. Latency usa mediciones reales de latencia a regiones AWS. Geolocation usa la ubicación del cliente. Multi-Value Answer NO es un load balancer real, pero puede devolver hasta 8 IPs saludables.", "k": "tip", "tab": "D2"}, {"q": "VPC Flow Logs", "a": "En Flow Logs, 'action=REJECT' indica que SG o NACL denegó el tráfico. 'action=ACCEPT' = permitido. Para inspección profunda de paquetes (DPI) usar Traffic Mirroring, no Flow Logs.", "k": "tip", "tab": "D3"}, {"q": "VPC Traffic Mirroring", "a": "Traffic Mirroring copia el tráfico RAW (Layer 3/4). Flow Logs solo captura metadatos. Para IDS/IPS en tiempo real: Traffic Mirroring.", "k": "tip", "tab": "D3"}, {"q": "Optimización de Performance de Red", "a": "EFA (Elastic Fabric Adapter) = ENA + OS bypass para HPC/ML (MPI workloads). NO es lo mismo que ENA. EFA requiere instancias en Cluster Placement Group para máximo rendimiento.", "k": "tip", "tab": "D3"}, {"q": "AWS WAF (Web Application Firewall)", "a": "WAF se integra con ALB y CloudFront pero NO con NLB directamente. Para proteger NLB, poner un ALB delante con WAF, o usar AWS Network Firewall. Usar Managed Rule Groups para protección rápida.", "k": "tip", "tab": "D4"}, {"q": "AWS Shield – Protección DDoS", "a": "Shield Standard es AUTOMÁTICO y GRATUITO para todos. Shield Advanced requiere suscripción. Para protección L7 avanzada, Shield Advanced + WAF. Solo Shield Advanced tiene DRT y cost protection.", "k": "tip", "tab": "D4"}, {"q": "AWS Network Firewall", "a": "Network Firewall inspecciona tráfico que pasa por él. Para inspectar tráfico entre VPCs: modelo centralizado con TGW y una Inspection VPC. El tráfico se enruta desde TGW → Firewall VPC → TGW → destino.", "k": "tip", "tab": "D4"}, {"q": "AWS Firewall Manager", "a": "Firewall Manager = plano de control centralizado. Requiere AWS Organizations. Ideal para empresas con múltiples cuentas que necesitan garantizar WAF o Network Firewall en todos los recursos.", "k": "tip", "tab": "D4"}, {"q": "Cifrado en Tránsito y Gestión de Certificados", "a": "ACM (público): gratis, no exportable, solo servicios AWS. ACM PCA: de pago, exportable, para PKI privada. Para implementar mTLS (autenticación mutua), necesitas ACM PCA para emitir certs de cliente.", "k": "tip", "tab": "D4"}, {"q": "Atributos Clave y su Efecto", "a": "PREGUNTA CLÁSICA: 'El tráfico va por VPN en vez de DX. ¿Qué hacer?' → Configurar LOCAL_PREF más alto en tu router para las rutas recibidas por DX. AWS ya prioriza DX sobre VPN por diseño (para el tráfico que va desde AWS hacia on-prem), pero para el tráfico desde on-prem hacia AWS, el control lo tiene tu router con LOCAL_PREF.", "k": "tip", "tab": "Deep"}, {"q": "Prioridad de Decisión BGP (Orden de Evaluación)", "a": "AWS siempre prefiere una ruta de Direct Connect sobre una VPN cuando ambas anuncian el mismo prefijo (igual longitud). Para forzar a tu router on-prem a preferir DX, usa LOCAL_PREF. Para influir lo que AWS prefiere cuando recibes 2 rutas iguales, usa AS_PATH prepending en la ruta que quieres que sea backup.", "k": "tip", "tab": "Deep"}, {"q": "AWS VPN CloudHub", "a": "VPN CloudHub NO requiere activar nada especial — es un comportamiento automático de un VGW con múltiples VPNs BGP. La trampa del examen: si una sucursal tiene rutas solapadas con otra, CloudHub NO funcionará.", "k": "tip", "tab": "Deep"}, {"q": "Private DNS en Interface Endpoints – Comportamiento Híbrido", "a": "Si on-prem necesita usar un Interface Endpoint (ej. para llegar a S3 via IP privada), el flujo es: DNS on-prem → forwarding rule → R53 Inbound Endpoint (IP privada en VPC) → Route 53 Resolver → PHZ → IP del Interface Endpoint.", "k": "tip", "tab": "Deep"}, {"q": "Egress-Only Internet Gateway (EIGW)", "a": "EIGW = NAT Gateway del mundo IPv6, pero SIN traducción de direcciones. En IPv6 no hay NAT. Si quieres instancias IPv6 que salgan a internet pero no sean alcanzables desde internet: EIGW.", "k": "tip", "tab": "Deep"}, {"q": "NAT64 y DNS64 – IPv6 → IPv4", "a": "DNS64 + NAT64 = solución para comunicar subnets IPv6-only con el mundo IPv4. El prefijo 64:ff9b::/96 es el prefijo estándar de RFC 6146 para NAT64. En el examen: si ves 'subnets IPv6-only necesitan llegar a servicios IPv4' → DNS64 + NAT64.", "k": "tip", "tab": "Deep"}, {"q": "TGW Appliance Mode – Enrutamiento Simétrico", "a": "Appliance Mode se configura en el TGW VPC Attachment de la Inspection VPC, NO en los otros attachments. La CLI: aws ec2 modify-transit-gateway-vpc-attachment --options ApplianceModeSupport=enable.", "k": "tip", "tab": "Deep"}, {"q": "BFD – Bidirectional Forwarding Detection", "a": "Si el examen pide 'failover ultra-rápido (sub-segundo)' entre DX y VPN de backup → la respuesta es habilitar BFD en el router on-prem. Sin BFD, BGP tarda hasta 90 segundos en detectar la caída. Con BFD, la detección es en < 1 segundo.", "k": "tip", "tab": "Deep"}, {"q": "VPC DNS & DHCP – Detalles de Configuración", "a": "Para resolver nombres on-prem desde AWS: R53 Outbound Endpoint + Forwarding Rule hacia DNS on-prem. Para resolver nombres AWS desde on-prem: R53 Inbound Endpoint + regla en DNS on-prem que apunte al Inbound Endpoint IP. Ambos endpoints necesitan ENIs en subnets privadas y deben crearse en ≥2 AZs para HA. Cada endpoint soporta 10,000 queries/seg por IP.", "k": "tip", "tab": "Ref"}, {"q": "Site-to-Site VPN – Detalles Técnicos Avanzados", "a": "EC2-based VPN: usar cuando necesitas protocolo no-IPsec (GRE/DMVPN), CIDRs solapados, routing transitivo, o BW > 1.25 Gbps. Requiere deshabilitar Source/Dest Check + habilitar IP Forwarding a nivel OS. IPsec NO funciona a través de NLB (protocolo 50 != TCP).", "k": "tip", "tab": "Ref"}, {"q": "Direct Connect – Especificaciones Técnicas Completas", "a": "SiteLink resuelve 'comunicar oficinas por la red de AWS sin pasar por una Region'. Si la pregunta menciona routing transitivo site-to-site sin TGW: DX SiteLink. Si menciona routing transitivo via DX GW entre VPCs: eso NO es posible (DX GW no es transitivo VPC-a-VPC).", "k": "tip", "tab": "Ref"}, {"q": "Direct Connect – Especificaciones Técnicas Completas", "a": "Para Private VIF: Las BGP Communities de LOCAL_PREF (7100/7200/7300) se evalúan ANTES que AS_PATH prepending. Si quieres que AWS prefiera VIF A: anunciar desde A con 7224:7300. Para Public VIF: controla el alcance de las rutas que AWS recibe desde on-prem (9100=local DX PoP, 9200=continente, 9300=global).", "k": "tip", "tab": "Ref"}, {"q": "Transit Gateway – Multicast", "a": "Para SG/NACL con IGMP multicast: IP origen 0.0.0.0/32, IP destino 224.0.0.1/32, Protocolo IGMP (número 2). El TGW multicast solo funciona dentro de TGW attachments normales (VPC).", "k": "tip", "tab": "Ref"}, {"q": "VPC Lattice – Service-to-Service Networking", "a": "VPC Lattice resuelve comunicación service-to-service con CIDRs solapados sin VPC Peering. Para clientes externos (VPN/DX/TGW): usar VPC Endpoint de tipo service-network (no link-local). Si la pregunta pide 'Zero Trust service mesh' o 'microservices entre cuentas sin peering' → VPC Lattice.", "k": "tip", "tab": "Ref"}, {"q": "MTU por Escenario – Tabla Completa", "a": "La trampa más común: Jumbo Frames en DX Private VIF solo funcionan para rutas PROPAGADAS desde el VGW. Si la ruta es ESTÁTICA en la route table, MTU = 1500 aunque la conexión DX soporte 9001. Para verificar MTU: tracepath amazon.com (Linux). Para configurar: ip link set dev eth0 mtu 9001.", "k": "tip", "tab": "Ref"}, {"q": "ELB – Detalles Técnicos Avanzados", "a": "Proxy Protocol v2 en NLB: necesario cuando el target se registra por IP (TCP/TLS) para preservar la IP del cliente. Si el target es Instance ID o UDP → IP ya se preserva automáticamente. ALB usa X-Forwarded-For (no necesita Proxy Protocol). NUNCA habilitar Proxy Protocol si el LB ya está detrás de otro proxy — genera headers duplicados = errores.", "k": "tip", "tab": "Ref"}, {"q": "EKS – Fórmula de Pods por Nodo y Detalles", "a": "Fórmula max pods: (número ENIs) × (IPs/ENI − 1) + 2. Con prefix delegation ×16 (IPv4). Tablas de referencia en: github.com/awslabs/amazon-eks-ami/blob/master/files/eni-max-pods.txt. Para aumentar densidad de pods: usar instancias con más ENIs (mayor tipo) + prefix delegation.", "k": "tip", "tab": "Ref"}, {"q": "CloudFront – Detalles Adicionales", "a": "CF Functions y Lambda@Edge NO se pueden combinar en el MISMO viewer event (viewer request o viewer response). Lambda@Edge se authora SIEMPRE en us-east-1, luego AWS lo replica. CF Functions: ideal para alta escala < 1ms (JWT, URL rewrite, header manipulation). Lambda@Edge: cuando necesitas > 1ms, network access, o leer el request body.", "k": "tip", "tab": "Ref"}, {"q": "Cifrado a nivel Capa 2 (enlace) en Direct Connect", "a": "MACsec (802.1AE) – solo en dedicated connections", "k": "rule", "tab": "5s"}, {"q": "Cifrado Capa 3 (IP) sobre Direct Connect", "a": "IPsec VPN sobre DX (Public VIF o Transit VIF)", "k": "rule", "tab": "5s"}, {"q": "Inspección L7 centralizada para múltiples VPCs (IDS/IPS escalable)", "a": "AWS Network Firewall en Inspection VPC + TGW centralizado", "k": "rule", "tab": "5s"}, {"q": "Conectar 2 VPCs con CIDRs solapados para compartir 1 servicio", "a": "AWS PrivateLink (Interface Endpoint). VPC Peering y TGW fallan con overlap.", "k": "rule", "tab": "5s"}, {"q": "Verificar reglas SG/NACL sin enviar tráfico real", "a": "VPC Reachability Analyzer", "k": "rule", "tab": "5s"}, {"q": "Instancias IPv6 en subnet privada que solo pueden salir a internet", "a": "Egress-Only Internet Gateway (EIGW)", "k": "rule", "tab": "5s"}, {"q": "Pods EKS IPv6-only que necesitan llegar a servicios IPv4", "a": "DNS64 + NAT64 en NAT Gateway", "k": "rule", "tab": "5s"}, {"q": "Failover sub-segundo entre DX y VPN de backup", "a": "BFD (Bidirectional Forwarding Detection) en router on-prem", "k": "rule", "tab": "5s"}, {"q": "Tráfico asimétrico en firewall stateful detrás de TGW", "a": "Activar Appliance Mode en TGW VPC Attachment de la Inspection VPC", "k": "rule", "tab": "5s"}, {"q": "Priorizar DX sobre VPN para tráfico saliente desde on-prem hacia AWS", "a": "LOCAL_PREF más alto en el router on-prem para rutas aprendidas por DX", "k": "rule", "tab": "5s"}, {"q": "Hacer que VPN sea backup: influir tráfico ENTRANTE a AWS", "a": "AS_PATH Prepending más largo en las rutas anunciadas por VPN hacia AWS", "k": "rule", "tab": "5s"}, {"q": "IP estática global + protocolo TCP/UDP (no HTTP)", "a": "AWS Global Accelerator (NO CloudFront)", "k": "rule", "tab": "5s"}, {"q": "CDN con caching + HTTPS para contenido web", "a": "CloudFront (NO Global Accelerator)", "k": "rule", "tab": "5s"}, {"q": "Reemplazar Transit VPC legacy con appliances EC2", "a": "AWS Transit Gateway (managed, sin EC2, escalable)", "k": "rule", "tab": "5s"}, {"q": "Compartir un servicio con cuentas externas sin peering/IGW", "a": "AWS PrivateLink (NLB como provider + Interface Endpoint como consumer)", "k": "rule", "tab": "5s"}, {"q": "On-prem acceder a S3 por IP privada (sin pasar por internet)", "a": "Interface Endpoint para S3 (NOT Gateway Endpoint, que no es accesible desde on-prem)", "k": "rule", "tab": "5s"}, {"q": "Máxima resiliencia DX para producción crítica", "a": "4 conexiones: 2 en DX Location A + 2 en DX Location B distintos", "k": "rule", "tab": "5s"}, {"q": "Controlar alcance de rutas anunciadas en Public VIF de DX", "a": "BGP Communities (7224:9100 local, 7224:9200 continental, 7224:9300 global)", "k": "rule", "tab": "5s"}, {"q": "Conectar oficinas entre sí usando backbone AWS sin pasar por Region", "a": "AWS Direct Connect SiteLink (en Private VIF o Transit VIF)", "k": "rule", "tab": "5s"}, {"q": "Comunicar microservicios entre VPCs/cuentas con CIDRs solapados", "a": "VPC Lattice (service-to-service). PrivateLink si es un servicio puntual.", "k": "rule", "tab": "5s"}, {"q": "Multiplticast entre VPCs dentro de AWS", "a": "Transit Gateway con Multicast habilitado (solo puede activarse al CREAR el TGW)", "k": "rule", "tab": "5s"}, {"q": "Instancias non-Nitro en solución multicast", "a": "Pueden ser RECEIVERS (con Src/Dst check deshabilitado) pero NO SENDERS", "k": "rule", "tab": "5s"}, {"q": "NLB target en VPC pereado → no preserva IP cliente", "a": "Registrar target por IP address (no Instance ID) + Proxy Protocol v2", "k": "rule", "tab": "5s"}, {"q": "ALB/NLB/CF cert → Error: cert not found", "a": "CloudFront requiere cert en us-east-1. ALB/NLB: cert en la misma región.", "k": "rule", "tab": "5s"}, {"q": "Lambda@Edge función no disponible en todas las regiones", "a": "Lambda@Edge siempre se authora en us-east-1, AWS la replica automáticamente", "k": "rule", "tab": "5s"}, {"q": "CF Functions + Lambda@Edge en mismo evento viewer", "a": "NO es posible combinarlos en viewer request o viewer response del mismo behavior", "k": "rule", "tab": "5s"}, {"q": "Route 53 health check para EC2 privado en subnet privada", "a": "CloudWatch Metric + CloudWatch Alarm → R53 Health Check monitorea el Alarm", "k": "rule", "tab": "5s"}, {"q": "DNSSEC en Private Hosted Zone", "a": "No posible. DNSSEC solo para Public Hosted Zones", "k": "rule", "tab": "5s"}, {"q": "DNS Firewall bloquea todo por posible fallo del firewall", "a": "Configurar Fail-open (disponibilidad). Fail-close = seguridad > disponibilidad", "k": "rule", "tab": "5s"}, {"q": "Network Firewall stateful: tráfico bloqueado sin configurar nada", "a": "NO — NF stateful PERMITE todo por defecto. Reglas AÑADEN restricciones (opuesto a SGs)", "k": "rule", "tab": "5s"}, {"q": "GWLB no recibe tráfico de target en otro SG", "a": "GWLB no tiene SG propio. Los SGs de los targets deben usar IPs del GWLB, no SG IDs", "k": "rule", "tab": "5s"}, {"q": "Aumentar pods por nodo EKS más allá de 29 (m5.large estándar)", "a": "Habilitar Prefix Delegation (/28 por ENI, ×16 pods). Solo instancias Nitro", "k": "rule", "tab": "5s"}, {"q": "DX Private VIF con jumbo frames pero MTU llega 1500", "a": "Rutas ESTÁTICAS siempre usan 1500. Jumbo frames (9001) solo para rutas PROPAGADAS", "k": "rule", "tab": "5s"}, {"q": "On-premises necesita llegar a S3 via IP privada (no pasa por internet)", "a": "Interface Endpoint para S3 (Gateway Endpoint no es accesible desde on-prem)", "k": "rule", "tab": "5s"}, {"q": "BGP Community para que AWS prefiera rutas de un VIF específico", "a": "7224:7300 (HIGH) en el VIF preferido, 7224:7100 (LOW) en el backup (evaluado antes que AS_PATH)", "k": "rule", "tab": "5s"}, {"q": "DX Hosted connection tiene múltiples VIFs", "a": "NO — Hosted connection = exactamente 1 VIF. Solo Dedicated admite múltiples VIFs (hasta 50)", "k": "rule", "tab": "5s"}, {"q": "Client VPN permite el mismo rango CIDR que el VPC target", "a": "Error — Client CIDR NO puede solapar con el VPC CIDR de la subnet asociada. Usar /22 a /12.", "k": "rule", "tab": "5s"}];

/* ---------- topology animation ---------- */
let rafId;
function netAnim(cv){
  cancelAnimationFrame(rafId);if(!cv)return;
  const ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  const labels=['VPC','TGW','DX','VGW','R53','NLB','GWLB','CGW','PL','CF','DXGW','NFW'];
  let W,Hh,nodes,edges,pk=[];
  function setup(){const r=cv.getBoundingClientRect();W=r.width;Hh=r.height;cv.width=W*dpr;cv.height=Hh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    const nar=W<600,x0=nar?.42:.55,y1=nar?.36:.62;nodes=[];let guard=0;
    for(let i=0;i<labels.length&&guard<4000;guard++){const x=nar?W*(.06+.82*rnd()):W*(x0+(.95-x0)*rnd()),y=nar?18+120*rnd():Hh*(.09+(y1-.09)*rnd());if(nodes.every(n=>Math.hypot(n.x-x,n.y-y)>(nar?44:62))){nodes.push({l:labels[i],x,y,r:i===1?7:4.5});i++}}
    edges=[];nodes.forEach((n,i)=>{const d=nodes.map((m,j)=>[j,Math.hypot(m.x-n.x,m.y-n.y)]).filter(a=>a[0]!==i).sort((a,b)=>a[1]-b[1]);d.slice(0,2).forEach(([j])=>{if(!edges.some(e=>(e[0]===j&&e[1]===i)))edges.push([i,j])})});}
  setup();addEventListener('resize',setup,{once:true});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t){ctx.clearRect(0,0,W,Hh);
    ctx.lineWidth=1;edges.forEach(([a,b])=>{ctx.strokeStyle='rgba(178,202,253,.16)';ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y);ctx.stroke()});
    if(!reduce&&Math.random()<.08&&pk.length<14){const e=edges[Math.floor(Math.random()*edges.length)];pk.push({e,t:0,s:.006+Math.random()*.01,rev:Math.random()<.5})}
    pk=pk.filter(p=>p.t<=1);pk.forEach(p=>{p.t+=p.s;const[a,b]=p.rev?[p.e[1],p.e[0]]:p.e;const x=nodes[a].x+(nodes[b].x-nodes[a].x)*p.t,y=nodes[a].y+(nodes[b].y-nodes[a].y)*p.t;ctx.fillStyle='#e0f24a';ctx.shadowColor='#e0f24a';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,y,2.4,0,7);ctx.fill();ctx.shadowBlur=0});
    nodes.forEach((n,i)=>{const pulse=1+.25*Math.sin(t/600+i);ctx.fillStyle=i===1?'#5453eb':'#1f1f48';ctx.strokeStyle=i===1?'#b2cafd':'rgba(178,202,253,.5)';ctx.beginPath();ctx.arc(n.x,n.y,n.r*pulse,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(178,202,253,.75)';ctx.font='600 10px JetBrains Mono, monospace';ctx.fillText(n.l,n.x+9,n.y+3)});
    rafId=requestAnimationFrame(frame)}
  rafId=requestAnimationFrame(frame);
}

function draw(){const c=deck[di%deck.length],el=$('#deck');
  if(mode==='flash'){el.innerHTML=`<span class="eyebrow">${c.k==='rule'?'Regla de 5 segundos':'Exam tip'} · ${esc(c.tab)} · ${di%deck.length+1}/${deck.length}</span><div class="q">${esc(c.q)}</div><div class="a" hidden>${esc(c.a)}</div><div class="row"><button class="btn-o" id="flip">Voltear</button><button class="btn-l" id="nx">Siguiente →</button></div>`;
    $('#flip').onclick=()=>{const a=el.querySelector('.a');a.hidden=!a.hidden};$('#nx').onclick=next}
  else{const opts=shuffle([c.a,...shuffle(CARDS.filter(x=>x.k==='rule'&&x.a!==c.a)).slice(0,3).map(x=>x.a)]);
    el.innerHTML=`<span class="eyebrow">Si el examen pide… · ${di%deck.length+1}/${deck.length}</span><div class="q">${esc(c.q)}</div><div class="opts">${opts.map((o,k)=>`<button data-o="${k}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="row"><button class="btn-l" id="nx" hidden>Siguiente →</button></div>`;
    el.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(b,c.a));$('#nx').onclick=next}}
function answer(b,right){const el=$('#deck');if(el.querySelector('.opts button:disabled'))return;seen++;const ok=b.textContent.slice(1)===right||b.querySelector('span:last-child').textContent===right;if(ok){score++;streak++;if(streak>best){best=streak;LS.set('ans-best',best)}}else streak=0;
  el.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.querySelector('span:last-child').textContent===right)x.classList.add('ok')});if(!ok)b.classList.add('ko');kpis();const n=$('#nx');n.hidden=false;n.focus()}
function next(){di++;draw()}
addEventListener('keydown',e=>{if(!pal.hidden||CUR!=='reto')return;if(e.target.tagName==='INPUT')return;
  if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opts button[data-o="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}
  else if(e.key===' '&&mode==='flash'){e.preventDefault();$('#flip')?.click()}
  else if(e.key==='ArrowRight'){const n=$('#nx');if(n&&!n.hidden)next()}});

/* ---------- palette ---------- */
let sel=0,res=[];
function openPal(){pal.hidden=false;palIn.value='';search();setTimeout(()=>palIn.focus(),10)}
function closePal(){pal.hidden=true}
function search(){const v=palIn.value.trim().toLowerCase();
  if(!v){res=ITEMS.slice(0,8).map(i=>({type:'t',i}))}else{
    const t=ITEMS.filter(i=>i.s.includes(v)).slice(0,10).map(i=>({type:'t',i}));
    const c=CARDS.filter(c=>(c.q+' '+c.a).toLowerCase().includes(v)).slice(0,6).map(c=>({type:'c',c}));res=[...t,...c]}
  sel=0;paint()}
function paint(){palList.innerHTML=res.length?res.map((r,k)=>r.type==='t'?`<li role="option" data-k="${k}" aria-selected="${k===sel}"><span class="code" style="width:38px">${esc(r.i.short)}</span><span><b>${esc(r.i.t)}</b><span class="x">${r.i.n?r.i.n+(r.i.n>1?' trampas · ':' trampa · '):''}${esc(DATA.find(d=>d.id===r.i.dom).label)}</span></span></li>`:`<li role="option" data-k="${k}" aria-selected="${k===sel}"><span class="code" style="width:38px;color:var(--lime)">!</span><span><b>${esc(r.c.q)}</b><span class="x">${esc(r.c.a)}</span></span></li>`).join(''):'<li class="empty">No encontré ese tema. Prueba con otra palabra.</li>';
  palList.querySelectorAll('li[data-k]').forEach(li=>{li.onclick=()=>go(+li.dataset.k);li.onmousemove=()=>{if(sel!==+li.dataset.k){sel=+li.dataset.k;palList.querySelectorAll('li').forEach(x=>x.setAttribute('aria-selected',x.dataset.k==sel))}}})}
function go(k){const r=res[k];if(!r)return;closePal();if(r.type==='t'){nav2(`${r.i.dom}/${r.i.id}`)}else{nav2('reto')}}
palIn.oninput=search;
palIn.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(res.length-1,sel+1);paint()}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);paint()}else if(e.key==='Enter'){go(sel)}else if(e.key==='Escape')closePal()};
pal.onclick=e=>{if(e.target===pal)closePal()};
document.querySelectorAll('[data-open-pal]').forEach(b=>b.onclick=openPal);
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav2(b.dataset.go));
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.hidden?openPal():closePal()}else if(e.key==='/'&&pal.hidden&&e.target.tagName!=='INPUT'){e.preventDefault();openPal()}});

/* ---------- router ---------- */
let CUR='inicio';
function nav2(path){try{history.replaceState(null,'','#'+path)}catch(e){}route(path)}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();nav2(a.getAttribute('href').slice(1))});
function route(path){let h='';try{h=location.hash.slice(1)}catch(e){}const [v,item]=(path||h||'inicio').split('/');CUR=v;const d=DATA.find(x=>x.id===v);
  renderNav(d?d.id:v);
  if(d){domain(d);if(item)requestAnimationFrame(()=>openItem(item));else scrollTo(0,0)}
  else if(v==='reto'){reto();scrollTo(0,0)}
  else{home();scrollTo(0,0)}
  main.insertAdjacentHTML('beforeend',`<footer><a href="/" aria-label="DiveLearn, ir al inicio"><img src="logo-wordmark-white.png" alt="DiveLearn"></a><span>Guía de estudio ANS-C01 · Mar Ortiz. Verifica límites y novedades en la documentación oficial de AWS.</span></footer>`)}
addEventListener('hashchange',()=>route());route();
</script>
