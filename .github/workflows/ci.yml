name: ci

# Revisa la infraestructura y que el sitio compile en cada PR y en main. No entra a AWS: la cuenta está en el
# plan gratis, que bloquea el proveedor OIDC. Al pasar a plan pago se agregan plan/apply
# y el despliegue del sitio con OIDC (ver README).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [bootstrap, infra]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - name: validate
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: ${{ matrix.dir }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
